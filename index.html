<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Söz Kütüphanesi PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            color: #0f172a; 
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        .masonry-grid { column-count: 1; column-gap: 1rem; }
        @media (min-width: 640px) { .masonry-grid { column-count: 2; column-gap: 1.5rem; } }
        @media (min-width: 1024px) { .masonry-grid { column-count: 3; column-gap: 1.5rem; } }
        .masonry-item { break-inside: avoid; margin-bottom: 1rem; }

        .swipe-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            overflow-y: scroll; scroll-snap-type: y mandatory; background: #0f172a; z-index: 100;
        }
        .swipe-item {
            height: 100vh; scroll-snap-align: start;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 2rem; position: relative;
        }

        .sticky-header { position: sticky; top: 0; z-index: 40; }
        .active-btn { background-color: #4f46e5 !important; color: white !important; transform: scale(1.05); }
        button, .clickable { cursor: pointer; min-height: 44px; min-width: 44px; }
        .fade-out { opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
        
        /* Loading Screen visibility fix */
        #loading-screen.hidden { display: none !important; }
    </style>
</head>
<body class="antialiased pb-24">

    <!-- Yükleme Ekranı (Silmek yerine gizlemek için güncellendi) -->
    <div id="loading-screen" class="fixed inset-0 bg-white z-[200] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
        <p class="text-slate-400 font-medium animate-pulse uppercase tracking-widest text-xs">Kütüphane Hazırlanıyor</p>
    </div>

    <div class="max-w-6xl mx-auto px-4 hidden opacity-0 transition-opacity duration-500" id="app-container">
        
        <div class="sticky-header py-4 bg-[#f8fafc]/80 backdrop-blur-md">
            <header class="flex justify-between items-center mb-4">
                <h1 onclick="handleHeaderClick()" class="clickable text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2 select-none">
                    <i class="fas fa-layer-group text-indigo-500"></i> Kütüphane
                </h1>
                <div class="flex gap-2">
                    <button onclick="switchView('gallery')" id="view-gal-btn" class="p-3 rounded-xl bg-white shadow-sm border border-slate-200 text-slate-500 active-btn transition-all">
                        <i class="fas fa-th-large"></i>
                    </button>
                    <button onclick="switchView('swipe')" id="view-swp-btn" class="p-3 rounded-xl bg-white shadow-sm border border-slate-200 text-slate-500 transition-all">
                        <i class="fas fa-mobile-screen"></i>
                    </button>
                </div>
            </header>
            
            <div class="flex items-center bg-white rounded-2xl px-4 shadow-sm border border-slate-100 mb-4 focus-within:ring-2 focus-within:ring-indigo-400 transition-all">
                <i class="fas fa-search text-slate-300 mr-3"></i>
                <input type="text" id="search-input" onkeyup="filterQuotes()" placeholder="Sözlerde ara..." class="w-full py-3 bg-transparent outline-none text-sm text-slate-700">
            </div>

            <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide" id="category-filters"></div>
        </div>

        <!-- Günün Sözü Paneli -->
        <div id="daily-panel" class="mb-8 p-6 md:p-10 rounded-[2.5rem] bg-gradient-to-br from-indigo-600 via-indigo-700 to-purple-800 text-white shadow-2xl shadow-indigo-200 relative overflow-hidden hidden">
            <div class="absolute -right-10 -top-10 text-[12rem] opacity-10">
                <i class="fas fa-quote-right"></i>
            </div>
            <div class="relative z-10">
                <span class="inline-block px-4 py-1.5 bg-white/10 backdrop-blur-md rounded-full text-[10px] font-black uppercase tracking-[0.2em] mb-6">Günün İlhamı</span>
                <p id="daily-text" class="text-2xl md:text-4xl font-light italic leading-tight mb-8">"..."</p>
                <div class="flex justify-between items-end">
                    <div>
                        <p id="daily-author" class="font-bold text-indigo-100 text-lg">— </p>
                        <p class="text-[10px] text-white/50 uppercase mt-1 tracking-widest">Söz Kütüphanesi</p>
                    </div>
                    <button onclick="shareDaily()" class="w-12 h-12 bg-white/10 rounded-full hover:bg-white/20 transition flex items-center justify-center">
                        <i class="fas fa-share-alt"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Yönetim Paneli -->
        <div id="admin-dashboard" class="hidden mb-8 p-6 md:p-8 bg-white rounded-[2.5rem] shadow-xl border-2 border-indigo-50">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-xl font-bold text-slate-800 flex items-center gap-3">
                    <div class="w-10 h-10 bg-indigo-500 rounded-xl flex items-center justify-center text-white text-sm">
                        <i class="fas fa-user-shield"></i>
                    </div>
                    Yönetim Paneli
                </h2>
                <button onclick="logoutAdmin()" class="text-xs font-black text-red-400 hover:text-red-600 uppercase tracking-widest">Kapat</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-4">
                    <div id="edit-title" class="text-xs font-black text-slate-400 uppercase tracking-widest">Söz İşlemleri</div>
                    <input type="hidden" id="edit-id">
                    <textarea id="quote-text" rows="3" class="w-full p-5 rounded-2xl border border-slate-100 bg-slate-50 focus:ring-2 focus:ring-indigo-400 outline-none text-sm transition-all" placeholder="Sözü buraya yazın..."></textarea>
                    <div class="flex gap-3">
                        <input type="text" id="quote-author" class="flex-1 p-3.5 rounded-xl border border-slate-100 bg-slate-50 text-sm outline-none" placeholder="Yazar">
                        <input type="text" id="quote-category" class="flex-1 p-3.5 rounded-xl border border-slate-100 bg-slate-50 text-sm outline-none" placeholder="Kategori">
                    </div>
                    <div class="flex gap-2">
                        <button onclick="saveQuote()" id="save-btn" class="flex-1 bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition-all">Sözü Kaydet</button>
                        <button onclick="resetAdminForm()" class="px-5 bg-slate-100 text-slate-400 rounded-xl"><i class="fas fa-rotate-left"></i></button>
                    </div>
                </div>
                <div class="space-y-4">
                    <div class="text-xs font-black text-slate-400 uppercase tracking-widest">Akıllı İşlemler</div>
                    <textarea id="bulk-quotes" rows="3" class="w-full p-5 rounded-2xl border border-slate-100 bg-slate-50 text-sm outline-none" placeholder="Parantezli yazar isimlerini içeren listeyi yapıştırın..."></textarea>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="saveBulk()" class="bg-slate-800 text-white py-3.5 rounded-xl text-sm font-bold hover:bg-black transition-all">Toplu Aktar</button>
                        <button onclick="fixExistingQuotes()" class="bg-indigo-100 text-indigo-700 py-3.5 rounded-xl text-sm font-bold hover:bg-indigo-200 transition-all">Kütüphaneyi Düzenle</button>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="exportData()" class="flex-1 bg-white border border-slate-200 text-slate-600 py-2 rounded-xl text-xs font-bold">Yedek Al</button>
                        <button onclick="deleteAllQuotes()" class="flex-1 text-[10px] text-red-300 font-black hover:text-red-600 transition-colors uppercase">Kütüphaneyi Temizle</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="masonry-grid" id="gallery-feed"></div>
        <div id="swipe-feed" class="swipe-container hidden"></div>

        <div id="empty-state" class="hidden text-center py-32">
            <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-magnifying-glass text-slate-300 text-3xl"></i>
            </div>
            <p class="text-slate-400 font-medium">Söz bulunamadı.</p>
        </div>
    </div>

    <!-- Modals -->
    <div id="ui-modal" class="fixed inset-0 bg-slate-900/40 z-[300] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2.5rem] p-8 w-full max-w-sm shadow-2xl border border-slate-100 transform transition-all">
            <h3 id="ui-modal-title" class="text-xl font-black text-slate-800 mb-2">Başlık</h3>
            <div id="ui-modal-message" class="text-slate-500 text-sm mb-8 leading-relaxed">Mesaj</div>
            <input type="password" id="ui-modal-input" class="hidden w-full p-5 rounded-[1.5rem] border border-slate-100 bg-slate-50 mb-8 text-center tracking-[0.5em] text-2xl font-bold outline-none" placeholder="••••">
            <div class="flex gap-3 justify-end">
                <button id="ui-modal-cancel" class="hidden px-6 py-3 rounded-xl text-slate-400 font-bold hover:bg-slate-50 transition-all">İptal</button>
                <button id="ui-modal-confirm" class="px-8 py-3 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 transition-all">Tamam</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVbPr8GHUqx5nWtVlv_QVep5Or8vvLTGk",
            authDomain: "sozler-e81af.firebaseapp.com",
            databaseURL: "https://sozler-e81af-default-rtdb.firebaseio.com",
            projectId: "sozler-e81af",
            storageBucket: "sozler-e81af.firebasestorage.app",
            messagingSenderId: "289783119309",
            appId: "1:289783119309:web:c1ac900ccc610ed1b65884"
        };
        
        const appId = 'sabit-soz-kutuphanesi'; 
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null, allQuotes = [], filteredQuotes = [], isAdminLoggedIn = false;
        let headerClickCount = 0, headerClickTimer = null, currentCategory = 'Tümü', currentView = 'gallery';

        const showUIModal = (type, title, message, onConfirm = null) => {
            const modal = document.getElementById('ui-modal');
            if(!modal) return;
            document.getElementById('ui-modal-title').innerText = title;
            document.getElementById('ui-modal-message').innerHTML = message;
            const input = document.getElementById('ui-modal-input'), cancel = document.getElementById('ui-modal-cancel'), confirm = document.getElementById('ui-modal-confirm');
            input.classList.add('hidden'); input.value = ''; cancel.classList.add('hidden');
            confirm.onclick = () => { modal.classList.add('hidden'); if(onConfirm) onConfirm(input.value); };
            if(type === 'prompt') { input.classList.remove('hidden'); cancel.classList.remove('hidden'); setTimeout(() => input.focus(), 100); }
            else if (type === 'confirm') { cancel.classList.remove('hidden'); }
            cancel.onclick = () => modal.classList.add('hidden');
            modal.classList.remove('hidden');
        };

        const initAuth = async () => {
            try { await signInAnonymously(auth); } 
            catch (e) { const loader = document.getElementById('loading-screen'); if(loader) loader.innerHTML = `<p class='p-8 text-center text-red-500'>Bağlantı Hatası: ${e.message}</p>`; }
        };

        onAuthStateChanged(auth, (user) => { if (user) { currentUser = user; loadData(); } });

        const loadData = () => {
            const quotesRef = collection(db, 'artifacts', appId, 'public', 'data', 'quotes');
            onSnapshot(quotesRef, (snapshot) => {
                const loader = document.getElementById('loading-screen');
                if (loader) { 
                    loader.classList.add('fade-out'); 
                    // Silmek yerine sadece gizliyoruz ki daha sonra tekrar kullanabilelim
                    setTimeout(() => { if(loader) loader.classList.add('hidden'); }, 500); 
                }
                const appCont = document.getElementById('app-container');
                if(appCont) { appCont.classList.remove('hidden'); setTimeout(() => appCont.classList.remove('opacity-0'), 50); }
                allQuotes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a,b) => b.createdAt - a.createdAt);
                setDailyQuote(); updateCategories(); filterQuotes();
            }, (err) => console.error(err));
        };

        const setDailyQuote = () => {
            if(allQuotes.length === 0) return;
            const now = new Date(), start = new Date(now.getFullYear(), 0, 0), diff = now - start, day = Math.floor(diff / (1000 * 60 * 60 * 24));
            const quote = allQuotes[day % allQuotes.length];
            document.getElementById('daily-text').innerText = `"${quote.text}"`;
            document.getElementById('daily-author').innerText = `— ${quote.author || 'Anonim'}`;
            document.getElementById('daily-panel').classList.remove('hidden');
        };

        const updateCategories = () => {
            const cats = ['Tümü', ...new Set(allQuotes.map(q => q.category).filter(Boolean))];
            const filterCont = document.getElementById('category-filters');
            if(!filterCont) return;
            filterCont.innerHTML = cats.map(cat => `
                <button onclick="setCategory('${cat}')" class="whitespace-nowrap px-6 py-2.5 rounded-2xl text-[11px] font-black uppercase tracking-wider transition-all duration-300 ${currentCategory === cat ? 'active-btn shadow-lg shadow-indigo-100' : 'bg-white text-slate-400 border border-slate-100 hover:border-indigo-200'}">${cat}</button>
            `).join('');
        };

        window.setCategory = (cat) => { currentCategory = cat; updateCategories(); filterQuotes(); };

        window.filterQuotes = () => {
            const searchInput = document.getElementById('search-input');
            const search = searchInput ? searchInput.value.toLowerCase() : '';
            filteredQuotes = allQuotes.filter(q => {
                const matchCat = currentCategory === 'Tümü' || q.category === currentCategory;
                const matchSearch = q.text.toLowerCase().includes(search) || (q.author && q.author.toLowerCase().includes(search));
                return matchCat && matchSearch;
            });
            renderUI();
        };

        const renderUI = () => {
            const galFeed = document.getElementById('gallery-feed'), swpFeed = document.getElementById('swipe-feed'), empty = document.getElementById('empty-state');
            if (filteredQuotes.length === 0) { if(galFeed) galFeed.innerHTML = ''; if(swpFeed) swpFeed.innerHTML = ''; if(empty) empty.classList.remove('hidden'); return; }
            if(empty) empty.classList.add('hidden');

            if(galFeed) {
                galFeed.innerHTML = filteredQuotes.map(q => `
                    <div class="masonry-item" id="card-${q.id}">
                        <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-50 relative overflow-hidden group transition-all duration-500 hover:-translate-y-2 hover:shadow-2xl">
                            <i class="fas fa-quote-right absolute -right-4 -top-4 text-9xl text-slate-50 opacity-80 -z-10 rotate-12"></i>
                            <div class="mb-6"><span class="px-4 py-1.5 bg-indigo-50 text-indigo-500 rounded-full text-[9px] font-black uppercase tracking-[0.15em]">${q.category || 'Genel'}</span></div>
                            <p class="text-slate-800 text-xl font-medium leading-relaxed mb-10">"${q.text}"</p>
                            <div class="flex justify-between items-center pt-6 border-t border-slate-50">
                                <p class="text-slate-300 text-[10px] font-black uppercase tracking-widest">— ${q.author || 'Anonim'}</p>
                                <div class="flex gap-2">
                                    <button onclick="shareQuote(\`${q.text.replace(/`/g, '\\`').replace(/\n/g, ' ')}\`, \`${(q.author || 'Anonim').replace(/`/g, '\\`')}\`)" class="w-10 h-10 rounded-full bg-slate-50 text-slate-300 flex items-center justify-center transition-all"><i class="fas fa-share-nodes text-xs"></i></button>
                                    ${isAdminLoggedIn ? `
                                        <button onclick="editQuote('${q.id}')" class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-400 flex items-center justify-center transition-all"><i class="fas fa-pen text-xs"></i></button>
                                        <button onclick="deleteQuote('${q.id}')" class="w-10 h-10 rounded-full bg-red-50 text-red-400 flex items-center justify-center transition-all"><i class="fas fa-trash-alt text-xs"></i></button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            if(swpFeed) {
                swpFeed.innerHTML = filteredQuotes.map(q => `
                    <div class="swipe-item">
                        <div class="text-center max-w-xl">
                            <i class="fas fa-quote-left text-7xl text-indigo-500/20 mb-12"></i>
                            <p class="text-3xl md:text-6xl font-light text-slate-50 leading-tight mb-16 px-6 italic">"${q.text}"</p>
                            <p class="text-indigo-400 text-2xl font-bold uppercase tracking-widest">— ${q.author || 'Anonim'}</p>
                        </div>
                        <div class="absolute bottom-24 flex gap-6">
                            <button onclick="shareQuote(\`${q.text.replace(/`/g, '\\`').replace(/\n/g, ' ')}\`, \`${(q.author || 'Anonim').replace(/`/g, '\\`')}\`)" class="w-16 h-16 rounded-full bg-white/5 text-white flex items-center justify-center border border-white/10"><i class="fas fa-share-alt text-xl"></i></button>
                            <button onclick="switchView('gallery')" class="w-16 h-16 rounded-full bg-white/5 text-white flex items-center justify-center border border-white/10"><i class="fas fa-th-large text-xl"></i></button>
                        </div>
                    </div>
                `).join('');
            }
        };

        window.switchView = (v) => {
            currentView = v; const gal = document.getElementById('gallery-feed'), swp = document.getElementById('swipe-feed'), daily = document.getElementById('daily-panel');
            if(gal) gal.classList.toggle('hidden', v !== 'gallery'); if(swp) swp.classList.toggle('hidden', v !== 'swipe'); if(daily) daily.classList.toggle('hidden', v !== 'gallery');
            const galBtn = document.getElementById('view-gal-btn'), swpBtn = document.getElementById('view-swp-btn');
            if(galBtn) galBtn.classList.toggle('active-btn', v === 'gallery'); if(swpBtn) swpBtn.classList.toggle('active-btn', v === 'swipe');
            document.body.style.overflow = (v === 'swipe') ? 'hidden' : 'auto';
        };

        window.shareQuote = async (text, author) => {
            const shareData = { title: 'İlham', text: `"${text}"\n— ${author}` };
            try {
                if (navigator.share) await navigator.share(shareData);
                else { const temp = document.createElement("textarea"); temp.value = shareData.text; document.body.appendChild(temp); temp.select(); document.execCommand("copy"); document.body.removeChild(temp); showUIModal('alert', 'Kopyalandı', 'Söz panoya kopyalandı.'); }
            } catch (e) {}
        };

        window.shareDaily = () => { const t = document.getElementById('daily-text').innerText, a = document.getElementById('daily-author').innerText; shareQuote(t.replace(/"/g, ''), a.replace('— ', '')); };

        window.handleHeaderClick = () => {
            headerClickCount++; if (headerClickTimer) clearTimeout(headerClickTimer); headerClickTimer = setTimeout(() => { headerClickCount = 0; }, 2000);
            if (headerClickCount === 5) {
                headerClickCount = 0; if (isAdminLoggedIn) return;
                showUIModal('prompt', 'Güvenlik', 'Yönetim şifresini girin:', (v) => {
                    if(v === '22035034') { isAdminLoggedIn = true; document.getElementById('admin-dashboard').classList.remove('hidden'); window.scrollTo({top: 0, behavior: 'smooth'}); renderUI(); }
                    else showUIModal('alert', 'Hata', 'Şifre hatalı.');
                });
            }
        };

        window.logoutAdmin = () => { isAdminLoggedIn = false; document.getElementById('admin-dashboard').classList.add('hidden'); renderUI(); };

        const autoCat = (t) => {
            const l = t.toLowerCase();
            if (l.match(/aşk|sevgi|kalp|özlem/)) return 'Aşk';
            if (l.match(/başarı|hedef|çalış|kazan|asla|pes/)) return 'Motivasyon';
            if (l.match(/zaman|hayat|insan|gerçek|dünya|yaşam/)) return 'Felsefe';
            if (l.match(/komik|gül|eğlence|it|eşek/)) return 'Mizah';
            return 'Genel';
        };

        const parseQuoteLine = (line) => {
            let text = line.trim();
            let author = 'Anonim';
            const match = text.match(/\(([^)]+)\)$/);
            if (match) {
                author = match[1].trim();
                text = text.replace(match[0], '').trim();
            }
            return { text, author };
        };

        // Mevcut sözleri tara ve düzelte fonksiyonu
        window.fixExistingQuotes = async () => {
            showUIModal('confirm', 'Kütüphaneyi Düzenle', 'Tüm kütüphane taranacak ve parantez içindeki yazar isimleri ayrıştırılacak. Onaylıyor musunuz?', async () => {
                const loader = document.getElementById('loading-screen');
                if(loader) { loader.classList.remove('hidden'); loader.classList.remove('fade-out'); }
                try {
                    let fixCount = 0;
                    const snapshot = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'quotes'));
                    
                    for(const docSnap of snapshot.docs) {
                        const data = docSnap.data();
                        if (data.text.match(/\(([^)]+)\)$/)) {
                            const { text, author } = parseQuoteLine(data.text);
                            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'quotes', docSnap.id), {
                                text: text,
                                author: author
                            });
                            fixCount++;
                        }
                    }
                    if(loader) loader.classList.add('hidden');
                    showUIModal('alert', 'Tamamlandı', `${fixCount} adet sözün yazarı başarıyla düzeltildi.`);
                } catch(e) {
                    if(loader) loader.classList.add('hidden');
                    showUIModal('alert', 'Hata', 'Düzenleme işlemi sırasında bir sorun oluştu.');
                }
            });
        };

        window.saveQuote = async () => {
            const rawText = document.getElementById('quote-text').value.trim();
            let { text, author } = parseQuoteLine(rawText);
            const overrideAuthor = document.getElementById('quote-author').value.trim();
            const catStr = document.getElementById('quote-category').value.trim() || autoCat(text);
            const editId = document.getElementById('edit-id').value;

            if(!text) return showUIModal('alert', 'Uyarı', 'Söz içeriği boş bırakılamaz.');

            try {
                const finalAuthor = overrideAuthor || author;
                if(editId) { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'quotes', editId), { text: text, author: finalAuthor, category: catStr }); }
                else { await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'quotes'), { text: text, author: finalAuthor, category: catStr, createdAt: Date.now() }); }
                resetAdminForm(); showUIModal('alert', 'Başarılı', 'İşlem tamamlandı.');
            } catch(e) { showUIModal('alert', 'Hata', 'Veri kaydedilemedi.'); }
        };

        window.editQuote = (id) => {
            const q = allQuotes.find(item => item.id === id); if(!q) return;
            document.getElementById('quote-text').value = q.text; document.getElementById('quote-author').value = q.author || ''; document.getElementById('quote-category').value = q.category || '';
            document.getElementById('edit-id').value = id; document.getElementById('edit-title').innerText = "Düzenle"; document.getElementById('save-btn').innerText = "Güncelle"; window.scrollTo({top: 0, behavior: 'smooth'});
        };

        window.resetAdminForm = () => {
            document.getElementById('quote-text').value = ''; document.getElementById('quote-author').value = ''; document.getElementById('quote-category').value = ''; document.getElementById('edit-id').value = '';
            document.getElementById('edit-title').innerText = "Yeni Söz Ekle"; document.getElementById('save-btn').innerText = "Sözü Kaydet";
        };

        window.saveBulk = async () => {
            const bulkInput = document.getElementById('bulk-quotes');
            const bulk = bulkInput ? bulkInput.value.trim() : ''; 
            if(!bulk) return;
            const lines = bulk.split('\n').map(l => l.replace(/^[\.#\s]*/, '').trim()).filter(l => l.length > 3);
            const qRef = collection(db, 'artifacts', appId, 'public', 'data', 'quotes');
            
            const loader = document.getElementById('loading-screen'); 
            if(loader) { loader.classList.remove('hidden'); loader.classList.remove('fade-out'); }
            
            for(let i=0; i<lines.length; i++){
                const { text, author } = parseQuoteLine(lines[i]);
                await addDoc(qRef, { text, author, category: autoCat(text), createdAt: Date.now() + i });
            }
            if(bulkInput) bulkInput.value = ''; 
            if(loader) loader.classList.add('hidden');
            showUIModal('alert', 'Tamam', `${lines.length} adet söz aktarıldı.`);
        };

        window.deleteQuote = (id) => showUIModal('confirm', 'Sözü Sil', 'Bu sözü kütüphaneden kalıcı olarak siliyorsunuz?', async () => { try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'quotes', id)); } catch(e) {} });

        window.deleteAllQuotes = () => showUIModal('confirm', 'TÜMÜNÜ SİL?', 'Geri dönüş yok!', async () => {
            const loader = document.getElementById('loading-screen');
            if(loader) { loader.classList.remove('hidden'); loader.classList.remove('fade-out'); }
            try {
                const snapshot = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'quotes'));
                await Promise.all(snapshot.docs.map(d => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'quotes', d.id))));
                if(loader) loader.classList.add('hidden');
                showUIModal('alert', 'Temizlendi', 'Kütüphane tamamen boşaltıldı.');
            } catch(e) {
                if(loader) loader.classList.add('hidden');
                showUIModal('alert', 'Hata', 'İşlem başarısız.');
            }
        });

        window.exportData = () => { if(allQuotes.length === 0) return; const data = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allQuotes, null, 2)); const a = document.createElement('a'); a.href = data; a.download = `yedek_${Date.now()}.json`; a.click(); };

        window.downloadImage = (id) => {
            const cardWrap = document.getElementById(`card-${id}`); if(!cardWrap) return;
            const card = cardWrap.children[0]; const btns = card.querySelector('.flex.gap-2'); if(btns) btns.style.opacity = '0';
            html2canvas(card, { scale: 2, backgroundColor: '#ffffff', borderRadius: 40 }).then(canvas => {
                const a = document.createElement('a'); a.download = `soz_${id.substring(0,4)}.png`; a.href = canvas.toDataURL(); a.click(); if(btns) btns.style.opacity = '1';
            });
        };

        initAuth();
    </script>
</body>
</html>
