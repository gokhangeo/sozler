<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Söz Kütüphanesi PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            color: #0f172a; 
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Masonry Grid (Galeri Modu) */
        .masonry-grid { column-count: 1; column-gap: 1rem; }
        @media (min-width: 640px) { .masonry-grid { column-count: 2; column-gap: 1.5rem; } }
        @media (min-width: 1024px) { .masonry-grid { column-count: 3; column-gap: 1.5rem; } }
        .masonry-item { break-inside: avoid; margin-bottom: 1rem; }

        /* Akış Modu (Snap Scroll) */
        .swipe-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            overflow-y: scroll; scroll-snap-type: y mandatory; background: #0f172a; z-index: 100;
        }
        .swipe-item {
            height: 100vh; scroll-snap-align: start;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 2rem; position: relative;
        }

        /* Cam Efekti ve Animasyonlar */
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .sticky-header { position: sticky; top: 0; z-index: 40; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .active-btn { background-color: #4f46e5 !important; color: white !important; transform: scale(1.05); }
        
        /* Mobil Buton Dokunmatik Alanları */
        button { cursor: pointer; min-height: 44px; min-width: 44px; }
    </style>
</head>
<body class="antialiased pb-24">

    <!-- Yükleme Ekranı -->
    <div id="loading-screen" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-10 h-10 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
        <p class="text-slate-400 font-medium animate-pulse">Sözler Hazırlanıyor...</p>
    </div>

    <!-- Uygulama İçeriği -->
    <div class="max-w-6xl mx-auto px-4 hidden" id="app-container">
        
        <div class="sticky-header py-4 bg-[#f8fafc]/80 backdrop-blur-md">
            <header class="flex justify-between items-center mb-4">
                <h1 onclick="handleHeaderClick()" class="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2 select-none">
                    <i class="fas fa-layer-group text-indigo-500"></i> Kütüphane
                </h1>
                <div class="flex gap-2">
                    <button onclick="switchView('gallery')" id="view-gal-btn" class="p-3 rounded-xl bg-white shadow-sm border border-slate-200 text-slate-500 active-btn">
                        <i class="fas fa-th-large"></i>
                    </button>
                    <button onclick="switchView('swipe')" id="view-swp-btn" class="p-3 rounded-xl bg-white shadow-sm border border-slate-200 text-slate-500">
                        <i class="fas fa-mobile-screen"></i>
                    </button>
                </div>
            </header>
            
            <div class="flex items-center bg-white rounded-2xl px-4 shadow-sm border border-slate-100 mb-4 focus-within:ring-2 focus-within:ring-indigo-400 transition-all">
                <i class="fas fa-search text-slate-300 mr-3"></i>
                <input type="text" id="search-input" onkeyup="filterQuotes()" placeholder="Sözlerde ara..." class="w-full py-3 bg-transparent outline-none text-sm text-slate-700">
            </div>

            <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide" id="category-filters"></div>
        </div>

        <!-- Günün Sözü Paneli -->
        <div id="daily-panel" class="mb-8 p-6 rounded-[2rem] bg-gradient-to-br from-indigo-600 to-purple-700 text-white shadow-xl shadow-indigo-200 relative overflow-hidden hidden">
            <div class="absolute -right-10 -top-10 text-[10rem] opacity-10">
                <i class="fas fa-quote-right"></i>
            </div>
            <div class="relative z-10">
                <span class="inline-block px-3 py-1 bg-white/20 rounded-full text-[10px] font-bold uppercase tracking-widest mb-4">Günün İlhamı</span>
                <p id="daily-text" class="text-xl md:text-2xl font-light italic leading-relaxed mb-6">"..."</p>
                <div class="flex justify-between items-center">
                    <p id="daily-author" class="font-semibold text-indigo-100">— </p>
                    <button onclick="shareDaily()" class="p-2 bg-white/10 rounded-full hover:bg-white/20 transition">
                        <i class="fas fa-share-alt"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Admin Paneli -->
        <div id="admin-dashboard" class="hidden mb-8 p-6 bg-white rounded-[2rem] shadow-xl border-2 border-indigo-50">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-lg font-bold text-slate-800"><i class="fas fa-user-shield text-indigo-500 mr-2"></i>Yönetim Paneli</h2>
                <button onclick="logoutAdmin()" class="text-xs font-bold text-red-400">Panel Kapat</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-4">
                    <div id="edit-title" class="text-sm font-bold text-slate-600">Yeni Söz Ekle</div>
                    <input type="hidden" id="edit-id">
                    <textarea id="quote-text" rows="3" class="w-full p-4 rounded-2xl border border-slate-100 bg-slate-50 focus:ring-2 focus:ring-indigo-400 outline-none text-sm" placeholder="Sözü buraya yazın..."></textarea>
                    <div class="flex gap-2">
                        <input type="text" id="quote-author" class="flex-1 p-3 rounded-xl border border-slate-100 bg-slate-50 text-sm" placeholder="Yazar">
                        <input type="text" id="quote-category" class="flex-1 p-3 rounded-xl border border-slate-100 bg-slate-50 text-sm" placeholder="Kategori">
                    </div>
                    <div class="flex gap-2">
                        <button onclick="saveQuote()" id="save-btn" class="flex-1 bg-indigo-600 text-white p-3 rounded-xl font-bold">Kaydet</button>
                        <button onclick="resetAdminForm()" class="px-4 bg-slate-100 text-slate-500 rounded-xl"><i class="fas fa-rotate-left"></i></button>
                    </div>
                </div>
                <div class="space-y-4">
                    <div class="text-sm font-bold text-slate-600">Toplu & Yedek</div>
                    <textarea id="bulk-quotes" rows="3" class="w-full p-4 rounded-2xl border border-slate-100 bg-slate-50 text-sm" placeholder="Sözleri alt alta yapıştırın..."></textarea>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="saveBulk()" class="bg-slate-800 text-white p-3 rounded-xl text-sm font-bold">Toplu Aktar</button>
                        <button onclick="exportData()" class="bg-white border border-slate-200 p-3 rounded-xl text-sm font-bold">Yedek Al</button>
                    </div>
                    <button onclick="deleteAllQuotes()" class="w-full py-2 text-[10px] text-red-300 font-bold hover:text-red-600 transition">TÜMÜNÜ SİL</button>
                </div>
            </div>
        </div>

        <!-- Ana Akış (Galeri Modu) -->
        <div class="masonry-grid" id="gallery-feed"></div>

        <!-- Akış Modu (Swipe Container) -->
        <div id="swipe-feed" class="swipe-container hidden"></div>

        <div id="empty-state" class="hidden text-center py-20">
            <i class="fas fa-ghost text-5xl text-slate-200 mb-4"></i>
            <p class="text-slate-400">Gösterilecek söz bulunamadı.</p>
        </div>
    </div>

    <!-- Modals -->
    <div id="ui-modal" class="fixed inset-0 bg-slate-900/40 z-[110] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] p-6 w-full max-w-sm shadow-2xl border border-slate-100">
            <h3 id="ui-modal-title" class="text-lg font-bold text-slate-800 mb-2">Başlık</h3>
            <div id="ui-modal-message" class="text-slate-500 text-sm mb-6 leading-relaxed">Mesaj</div>
            <input type="password" id="ui-modal-input" class="hidden w-full p-4 rounded-2xl border border-slate-200 mb-6 text-center tracking-[0.5em] text-xl outline-none" placeholder="••••">
            <div class="flex gap-2 justify-end">
                <button id="ui-modal-cancel" class="hidden px-5 py-2.5 rounded-xl text-slate-400 font-bold transition">İptal</button>
                <button id="ui-modal-confirm" class="px-6 py-2.5 rounded-xl bg-indigo-600 text-white font-bold transition">Tamam</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVbPr8GHUqx5nWtVlv_QVep5Or8vvLTGk",
            authDomain: "sozler-e81af.firebaseapp.com",
            databaseURL: "https://sozler-e81af-default-rtdb.firebaseio.com",
            projectId: "sozler-e81af",
            storageBucket: "sozler-e81af.firebasestorage.app",
            messagingSenderId: "289783119309",
            appId: "1:289783119309:web:c1ac900ccc610ed1b65884"
        };
        
        const appId = 'sabit-soz-kutuphanesi'; 
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null, allQuotes = [], filteredQuotes = [], isAdminLoggedIn = false;
        let headerClickCount = 0, headerClickTimer = null, currentCategory = 'Tümü', currentView = 'gallery';

        const showUIModal = (type, title, message, onConfirm = null) => {
            const modal = document.getElementById('ui-modal');
            document.getElementById('ui-modal-title').innerText = title;
            document.getElementById('ui-modal-message').innerHTML = message;
            const input = document.getElementById('ui-modal-input'), cancel = document.getElementById('ui-modal-cancel'), confirm = document.getElementById('ui-modal-confirm');
            input.classList.add('hidden'); input.value = ''; cancel.classList.add('hidden');
            confirm.onclick = () => { modal.classList.add('hidden'); if(onConfirm) onConfirm(input.value); };
            if(type === 'prompt') { input.classList.remove('hidden'); cancel.classList.remove('hidden'); setTimeout(() => input.focus(), 100); }
            else if (type === 'confirm') { cancel.classList.remove('hidden'); }
            cancel.onclick = () => modal.classList.add('hidden');
            modal.classList.remove('hidden');
        };

        const initAuth = async () => {
            try { await signInAnonymously(auth); } 
            catch (e) { document.getElementById('loading-screen').innerHTML = `<p class='p-8 text-center text-red-500'>Hata: ${e.message}</p>`; }
        };

        onAuthStateChanged(auth, (user) => { if (user) { currentUser = user; loadData(); } });

        const loadData = () => {
            const quotesRef = collection(db, 'artifacts', appId, 'public', 'data', 'quotes');
            onSnapshot(quotesRef, (snapshot) => {
                document.getElementById('loading-screen').classList.add('opacity-0');
                setTimeout(() => document.getElementById('loading-screen').remove(), 500);
                document.getElementById('app-container').classList.remove('hidden');
                
                allQuotes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a,b) => b.createdAt - a.createdAt);
                
                setDailyQuote();
                updateCategories(); 
                filterQuotes();
            });
        };

        const setDailyQuote = () => {
            if(allQuotes.length === 0) return;
            const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
            const quote = allQuotes[dayOfYear % allQuotes.length];
            document.getElementById('daily-text').innerText = `"${quote.text}"`;
            document.getElementById('daily-author').innerText = `— ${quote.author || 'Anonim'}`;
            document.getElementById('daily-panel').classList.remove('hidden');
        };

        const updateCategories = () => {
            const cats = ['Tümü', ...new Set(allQuotes.map(q => q.category).filter(Boolean))];
            document.getElementById('category-filters').innerHTML = cats.map(cat => `
                <button onclick="setCategory('${cat}')" class="whitespace-nowrap px-5 py-2.5 rounded-2xl text-xs font-bold transition ${currentCategory === cat ? 'active-btn' : 'bg-white text-slate-500 border border-slate-100'}">${cat}</button>
            `).join('');
        };

        window.setCategory = (cat) => { currentCategory = cat; updateCategories(); filterQuotes(); };

        window.filterQuotes = () => {
            const search = document.getElementById('search-input').value.toLowerCase();
            filteredQuotes = allQuotes.filter(q => {
                const matchCat = currentCategory === 'Tümü' || q.category === currentCategory;
                const matchSearch = q.text.toLowerCase().includes(search) || (q.author && q.author.toLowerCase().includes(search));
                return matchCat && matchSearch;
            });
            renderUI();
        };

        const renderUI = () => {
            const galFeed = document.getElementById('gallery-feed'), swpFeed = document.getElementById('swipe-feed'), empty = document.getElementById('empty-state');
            
            if (filteredQuotes.length === 0) { galFeed.innerHTML = swpFeed.innerHTML = ''; empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');

            // Gallery Render
            galFeed.innerHTML = filteredQuotes.map(q => `
                <div class="masonry-item" id="card-${q.id}">
                    <div class="bg-white rounded-[2rem] p-7 shadow-sm border border-slate-100 relative overflow-hidden group transition-all duration-300">
                        <i class="fas fa-quote-right absolute -right-2 -top-2 text-7xl text-slate-50 opacity-60 -z-10 rotate-12"></i>
                        <div class="mb-4"><span class="px-3 py-1 bg-indigo-50 text-indigo-500 rounded-full text-[9px] font-black uppercase tracking-wider">${q.category || 'Genel'}</span></div>
                        <p class="text-slate-800 text-lg font-medium leading-relaxed mb-6">"${q.text}"</p>
                        <div class="flex justify-between items-center pt-5 border-t border-slate-50">
                            <p class="text-slate-400 text-[10px] font-bold">— ${q.author || 'Anonim'}</p>
                            <div class="flex gap-2">
                                <button onclick="shareQuote(\`${q.text}\`, \`${q.author}\`)" class="w-10 h-10 rounded-full bg-slate-50 text-slate-400 flex items-center justify-center transition"><i class="fas fa-share-nodes text-xs"></i></button>
                                ${isAdminLoggedIn ? `
                                    <button onclick="editQuote('${q.id}')" class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-400 flex items-center justify-center transition"><i class="fas fa-pen text-xs"></i></button>
                                    <button onclick="deleteQuote('${q.id}')" class="w-10 h-10 rounded-full bg-red-50 text-red-400 flex items-center justify-center transition"><i class="fas fa-trash-alt text-xs"></i></button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Swipe Render
            swpFeed.innerHTML = filteredQuotes.map(q => `
                <div class="swipe-item">
                    <div class="text-center max-w-lg">
                        <i class="fas fa-quote-left text-5xl text-indigo-500/30 mb-8"></i>
                        <p class="text-3xl md:text-5xl font-light text-slate-100 leading-tight mb-12 px-4 italic">"${q.text}"</p>
                        <p class="text-indigo-400 text-xl font-semibold">— ${q.author || 'Anonim'}</p>
                    </div>
                    <div class="absolute bottom-20 flex gap-4">
                        <button onclick="shareQuote(\`${q.text}\`, \`${q.author}\`)" class="w-14 h-14 rounded-full bg-white/10 text-white flex items-center justify-center backdrop-blur-xl border border-white/20"><i class="fas fa-share-alt"></i></button>
                        <button onclick="switchView('gallery')" class="w-14 h-14 rounded-full bg-white/10 text-white flex items-center justify-center backdrop-blur-xl border border-white/20"><i class="fas fa-th-large"></i></button>
                    </div>
                </div>
            `).join('');
        };

        window.switchView = (v) => {
            currentView = v;
            document.getElementById('gallery-feed').classList.toggle('hidden', v !== 'gallery');
            document.getElementById('swipe-feed').classList.toggle('hidden', v !== 'swipe');
            document.getElementById('daily-panel').classList.toggle('hidden', v !== 'gallery');
            document.getElementById('view-gal-btn').classList.toggle('active-btn', v === 'gallery');
            document.getElementById('view-swp-btn').classList.toggle('active-btn', v === 'swipe');
            if(v === 'swipe') document.body.style.overflow = 'hidden';
            else document.body.style.overflow = 'auto';
        };

        window.shareQuote = async (text, author) => {
            const data = { title: 'İlham', text: `"${text}"\n— ${author}` };
            if (navigator.share) await navigator.share(data);
            else { const t = document.createElement("textarea"); t.value = data.text; document.body.appendChild(t); t.select(); document.execCommand("copy"); document.body.removeChild(t); showUIModal('alert', 'Kopyalandı', 'Söz panoya kopyalandı.'); }
        };

        window.shareDaily = () => {
            const t = document.getElementById('daily-text').innerText;
            const a = document.getElementById('daily-author').innerText;
            shareQuote(t.replace(/"/g, ''), a.replace('— ', ''));
        };

        window.handleHeaderClick = () => {
            headerClickCount++;
            if (headerClickTimer) clearTimeout(headerClickTimer);
            headerClickTimer = setTimeout(() => { headerClickCount = 0; }, 2000);
            if (headerClickCount === 5) {
                headerClickCount = 0;
                if (isAdminLoggedIn) return;
                showUIModal('prompt', 'Yönetici Girişi', 'Şifreyi girin:', (v) => {
                    if(v === '22035034') { 
                        isAdminLoggedIn = true; 
                        document.getElementById('admin-dashboard').classList.remove('hidden'); 
                        renderUI();
                        window.scrollTo({top: 0, behavior: 'smooth'});
                    }
                    else showUIModal('alert', 'Hata', 'Şifre yanlış.');
                });
            }
        };

        window.logoutAdmin = () => { isAdminLoggedIn = false; document.getElementById('admin-dashboard').classList.add('hidden'); renderUI(); };

        window.saveQuote = async () => {
            const t = document.getElementById('quote-text').value.trim();
            const a = document.getElementById('quote-author').value.trim() || 'Anonim';
            const c = document.getElementById('quote-category').value.trim() || 'Genel';
            const editId = document.getElementById('edit-id').value;

            if(!t) return showUIModal('alert', 'Uyarı', 'Söz alanı boş.');

            try {
                if(editId) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'quotes', editId), { text: t, author: a, category: c });
                } else {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'quotes'), { text: t, author: a, category: c, createdAt: Date.now() });
                }
                resetAdminForm();
                showUIModal('alert', 'Başarılı', 'İşlem tamamlandı.');
            } catch(e) { showUIModal('alert', 'Hata', 'Kayıt yapılamadı.'); }
        };

        window.editQuote = (id) => {
            const q = allQuotes.find(item => item.id === id);
            document.getElementById('quote-text').value = q.text;
            document.getElementById('quote-author').value = q.author;
            document.getElementById('quote-category').value = q.category;
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-title').innerText = "Sözü Düzenle";
            document.getElementById('save-btn').innerText = "Güncelle";
            window.scrollTo({top: 0, behavior: 'smooth'});
        };

        window.resetAdminForm = () => {
            document.getElementById('quote-text').value = '';
            document.getElementById('quote-author').value = '';
            document.getElementById('quote-category').value = '';
            document.getElementById('edit-id').value = '';
            document.getElementById('edit-title').innerText = "Yeni Söz Ekle";
            document.getElementById('save-btn').innerText = "Kaydet";
        };

        window.saveBulk = async () => {
            const bulk = document.getElementById('bulk-quotes').value.trim();
            if(!bulk) return;
            const lines = bulk.split('\n').map(l => l.replace(/^[\.#\s]*/, '').trim()).filter(l => l.length > 3);
            const qRef = collection(db, 'artifacts', appId, 'public', 'data', 'quotes');
            for(let i=0; i<lines.length; i++){
                await addDoc(qRef, { text: lines[i], author: 'Anonim', category: 'Genel', createdAt: Date.now() + i });
            }
            document.getElementById('bulk-quotes').value = '';
            showUIModal('alert', 'Tamam', 'Toplu ekleme başarılı.');
        };

        window.deleteQuote = (id) => showUIModal('confirm', 'Sil?', 'Kalıcı olarak silinecek.', async () => await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'quotes', id)));

        window.deleteAllQuotes = () => showUIModal('confirm', 'TÜMÜNÜ SİL?', 'Geri dönüş yok!', async () => {
            const snapshot = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'quotes'));
            await Promise.all(snapshot.docs.map(d => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'quotes', d.id))));
            showUIModal('alert', 'Temizlendi', 'Kütüphane boşaltıldı.');
        });

        window.exportData = () => {
            const data = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allQuotes, null, 2));
            const a = document.createElement('a'); a.href = data; a.download = `yedek_${Date.now()}.json`; a.click();
        };

        window.downloadImage = (id) => {
            const card = document.getElementById(`card-${id}`).children[0];
            const btns = card.querySelector('.flex.gap-2');
            btns.style.display = 'none';
            html2canvas(card, { scale: 2, backgroundColor: '#ffffff', borderRadius: 32 }).then(canvas => {
                const a = document.createElement('a'); a.download = `soz.png`; a.href = canvas.toDataURL(); a.click();
                btns.style.display = 'flex';
            });
        };

        initAuth();
    </script>
</body>
</html>
