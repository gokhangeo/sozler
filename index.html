<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Söz Kütüphanesi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        /* Modern Mobil Uyumlu Masonry */
        .masonry-grid {
            column-count: 1;
            column-gap: 1rem;
        }
        @media (min-width: 640px) { .masonry-grid { column-count: 2; column-gap: 1.5rem; } }
        @media (min-width: 1024px) { .masonry-grid { column-count: 3; column-gap: 1.5rem; } }
        
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1rem;
        }
        @media (min-width: 640px) { .masonry-item { margin-bottom: 1.5rem; } }

        /* Zarif Kart Tasarımı */
        .quote-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1.5rem;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        /* Arama Çubuğu */
        .search-bar:focus-within { box-shadow: 0 0 0 2px #6366f1; }
        
        /* Yapışkan (Sticky) Üst Menü Arka Planı */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(248, 250, 252, 0.85);
            backdrop-filter: blur(12px);
            padding-top: 1rem;
            padding-bottom: 1rem;
            margin-left: -1rem;
            margin-right: -1rem;
            padding-left: 1rem;
            padding-right: 1rem;
        }
        @media (min-width: 640px) {
            .sticky-header { margin-left: 0; margin-right: 0; padding-left: 0; padding-right: 0; }
        }
        
        /* Custom Scrollbar for Modal */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="antialiased pb-20 selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Yükleme Ekranı -->
    <div id="loading-screen" class="fixed inset-0 bg-slate-50 z-50 flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
        <p class="text-slate-500 font-medium">Sözler Hazırlanıyor...</p>
    </div>

    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-4 hidden" id="app-container">
        
        <!-- Üst Menü & Arama -->
        <div class="sticky-header">
            <header class="flex flex-col md:flex-row justify-between items-center gap-4">
                <h1 onclick="handleHeaderClick()" class="cursor-pointer text-2xl font-bold text-slate-800 select-none hover:text-indigo-600 transition flex items-center gap-2">
                    <i class="fas fa-layer-group text-indigo-500"></i> Kütüphane
                </h1>
                
                <div class="w-full md:w-96 flex items-center bg-white rounded-2xl px-4 py-3 shadow-sm border border-slate-200 search-bar transition">
                    <i class="fas fa-search text-slate-400 mr-3"></i>
                    <input type="text" id="search-input" onkeyup="filterQuotes()" placeholder="Söz veya yazar ara..." class="w-full bg-transparent outline-none text-sm text-slate-700 placeholder-slate-400">
                </div>

                <button onclick="exportData()" class="hidden md:flex items-center gap-2 text-sm font-medium text-slate-500 hover:text-slate-800 transition bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-200">
                    <i class="fas fa-download"></i> Yedeği Al
                </button>
            </header>
            
            <!-- Kategori Butonları -->
            <div class="flex gap-2 overflow-x-auto pb-2 mt-4 scrollbar-hide" id="category-filters">
                <!-- Dinamik doldurulacak -->
            </div>
        </div>

        <!-- Sözler Izgarası (Masonry) -->
        <div class="masonry-grid" id="quotes-feed">
            <!-- Dinamik Sözler Buraya Gelecek -->
        </div>

        <!-- Boş Durum -->
        <div id="empty-state" class="hidden text-center py-20">
            <i class="fas fa-ghost text-5xl text-slate-300 mb-4"></i>
            <p class="text-slate-500">Aradığınız kriterde söz bulunamadı.</p>
        </div>
    </div>

    <!-- Yönetim Paneli Modalı -->
    <div id="admin-modal" class="fixed inset-0 bg-slate-900/40 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl w-full max-w-xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center p-6 border-b">
                <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <i class="fas fa-wand-magic-sparkles text-indigo-500"></i> Yönetim Paneli
                </h2>
                <button onclick="closeAdmin()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-red-100 hover:text-red-500 flex items-center justify-center transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="p-6 overflow-y-auto custom-scrollbar">
                <!-- Tekli Söz Ekleme -->
                <div class="bg-slate-50 p-5 rounded-2xl mb-6 border border-slate-100">
                    <h3 class="text-sm font-bold text-slate-700 mb-3"><i class="fas fa-plus-circle text-emerald-500 mr-2"></i>Tek Bir Söz Ekle</h3>
                    <textarea id="single-quote-text" rows="2" class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-400 outline-none resize-none mb-3 text-sm" placeholder="Söz metnini girin..."></textarea>
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="single-quote-author" class="flex-1 p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-400 outline-none text-sm" placeholder="Yazar (İsteğe bağlı)">
                        <input type="text" id="single-quote-category" class="flex-1 p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-400 outline-none text-sm" placeholder="Kategori (İsteğe bağlı)">
                    </div>
                    <button onclick="saveSingleQuote()" class="w-full bg-emerald-500 text-white p-3 rounded-xl font-medium hover:bg-emerald-600 transition shadow-sm">
                        Kütüphaneye Ekle
                    </button>
                </div>

                <!-- Toplu Söz Ekleme -->
                <div class="bg-indigo-50/50 p-5 rounded-2xl mb-6 border border-indigo-100">
                    <h3 class="text-sm font-bold text-slate-700 mb-2"><i class="fas fa-bolt text-indigo-500 mr-2"></i>Akıllı Toplu Ekleme</h3>
                    <p class="text-xs text-slate-500 mb-3">Sözleri alt alta yapıştırın. Sistem kategorileri otomatik bulacaktır.</p>
                    <textarea id="bulk-quotes" rows="5" class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-400 outline-none resize-none mb-3 text-sm bg-white" placeholder="Buraya yapıştırın..."></textarea>
                    <button onclick="saveBulkQuotesSmart()" class="w-full bg-slate-800 text-white p-3 rounded-xl font-medium hover:bg-slate-900 transition shadow-sm">
                        Analiz Et ve Kaydet
                    </button>
                </div>
                
                <!-- Dışa Aktar Butonu (Mobil için) -->
                <button onclick="exportData()" class="md:hidden w-full bg-white border border-slate-200 text-slate-700 p-3 rounded-xl font-medium hover:bg-slate-50 transition flex justify-center items-center gap-2 mb-6">
                    <i class="fas fa-download text-slate-400"></i> Tümünü Cihaza İndir
                </button>

                <!-- Tehlikeli Alan -->
                <div class="border-t border-red-100 pt-6 mt-2">
                    <button onclick="deleteAllQuotes()" class="w-full bg-red-50 text-red-600 border border-red-200 p-3 rounded-xl font-bold hover:bg-red-600 hover:text-white transition flex justify-center items-center gap-2">
                        <i class="fas fa-triangle-exclamation"></i> Kütüphanedeki Bütün Sözleri Sil
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Özel Uyarı Modalı -->
    <div id="ui-modal" class="fixed inset-0 bg-slate-900/40 z-[60] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl transform transition-all border border-slate-100">
            <h3 id="ui-modal-title" class="text-lg font-bold text-slate-800 mb-2">Başlık</h3>
            <div id="ui-modal-message" class="text-slate-500 text-sm mb-6 leading-relaxed">Mesaj</div>
            
            <input type="password" id="ui-modal-input" class="hidden w-full p-3 rounded-xl border border-slate-200 mb-6 text-center tracking-[0.3em] text-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••">
            
            <div class="flex gap-2 justify-end">
                <button id="ui-modal-cancel" class="hidden px-4 py-2 rounded-xl text-slate-500 hover:bg-slate-100 font-medium transition">İptal</button>
                <button id="ui-modal-confirm" class="px-5 py-2 rounded-xl bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition">Tamam</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVbPr8GHUqx5nWtVlv_QVep5Or8vvLTGk",
            authDomain: "sozler-e81af.firebaseapp.com",
            databaseURL: "https://sozler-e81af-default-rtdb.firebaseio.com",
            projectId: "sozler-e81af",
            storageBucket: "sozler-e81af.firebasestorage.app",
            messagingSenderId: "289783119309",
            appId: "1:289783119309:web:c1ac900ccc610ed1b65884"
        };
        
        // ÖNEMLİ DÜZELTME: Verilerin kaydedileceği yeri rastgele atamalardan korumak için sabit bir klasör adı belirledik.
        // Bu sayede sayfa yenilense de veriler aynı yerde kalır.
        const appId = 'sabit-soz-kutuphanesi'; 
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let allQuotes = [];
        let filteredQuotes = [];
        let isAdminLoggedIn = false;
        let headerClickCount = 0;
        let headerClickTimer = null;
        let currentCategory = 'Tümü';

        // Özel Modal
        const uiModal = document.getElementById('ui-modal');
        const showUIModal = (type, title, message, onConfirm = null) => {
            document.getElementById('ui-modal-title').innerText = title;
            document.getElementById('ui-modal-message').innerHTML = message;
            
            const inputEl = document.getElementById('ui-modal-input');
            const cancelBtn = document.getElementById('ui-modal-cancel');
            const confirmBtn = document.getElementById('ui-modal-confirm');

            inputEl.classList.add('hidden');
            inputEl.value = '';
            cancelBtn.classList.add('hidden');
            
            confirmBtn.onclick = () => {
                uiModal.classList.add('hidden');
                if(onConfirm) onConfirm(inputEl.value);
            };

            if(type === 'prompt') {
                inputEl.classList.remove('hidden');
                cancelBtn.classList.remove('hidden');
                setTimeout(() => inputEl.focus(), 100);
            } else if (type === 'confirm') {
                cancelBtn.classList.remove('hidden');
            }

            cancelBtn.onclick = () => uiModal.classList.add('hidden');
            uiModal.classList.remove('hidden');
        };

        // Giriş
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try { await signInWithCustomToken(auth, __initial_auth_token); } 
                    catch (e) { await signInAnonymously(auth); }
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                document.getElementById('loading-screen').classList.add('hidden');
                showUIModal('alert', 'Giriş Hatası', `Veritabanı bağlantısı kurulamadı. Firebase'de Anonymous giriş aktif mi kontrol edin.<br><br>Hata: ${error.message}`);
            }
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                loadData();
            }
        });

        // Veri Çekme
        const loadData = () => {
            if(!currentUser) return;
            const quotesRef = collection(db, 'artifacts', appId, 'public', 'data', 'quotes');
            
            onSnapshot(quotesRef, (snapshot) => {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');

                allQuotes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                allQuotes.sort((a,b) => b.createdAt - a.createdAt); 
                updateCategories();
                filterQuotes();
            }, (err) => {
                console.error(err);
                document.getElementById('loading-screen').classList.add('hidden');
                showUIModal('alert', 'Veri Çekme Hatası', `Firebase veritabanı kurallarınız engelliyor olabilir. Lütfen Firebase Console'dan Firestore Rules kısmını 'allow read, write: if true;' olarak güncelleyin.<br><br><b>Detay:</b> ${err.message}`);
            });
        };

        // Kategorileri Çıkar ve Butonları Oluştur
        const updateCategories = () => {
            const categories = ['Tümü', ...new Set(allQuotes.map(q => q.category).filter(Boolean))];
            const container = document.getElementById('category-filters');
            
            container.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" class="whitespace-nowrap px-4 py-2 rounded-xl text-sm font-medium transition ${currentCategory === cat ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">
                    ${cat}
                </button>
            `).join('');
        };

        window.setCategory = (cat) => {
            currentCategory = cat;
            updateCategories();
            filterQuotes();
        };

        // Arama ve Filtreleme
        window.filterQuotes = () => {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            
            filteredQuotes = allQuotes.filter(q => {
                const matchCategory = currentCategory === 'Tümü' || q.category === currentCategory;
                const matchSearch = q.text.toLowerCase().includes(searchTerm) || (q.author && q.author.toLowerCase().includes(searchTerm));
                return matchCategory && matchSearch;
            });
            
            renderFeed();
        };

        // Arayüzü Çiz
        const renderFeed = () => {
            const feed = document.getElementById('quotes-feed');
            const emptyState = document.getElementById('empty-state');
            
            if (filteredQuotes.length === 0) {
                feed.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            feed.innerHTML = filteredQuotes.map(q => `
                <div class="masonry-item" id="card-${q.id}">
                    <div class="bg-white rounded-[2rem] p-6 sm:p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] border border-slate-100 relative overflow-hidden group transition-all duration-300 hover:-translate-y-1">
                        <!-- Transparan İkon Arka Plan -->
                        <i class="fas fa-quote-right absolute -right-4 -top-4 text-9xl text-slate-50 opacity-80 -z-10 rotate-12"></i>
                        
                        <div class="flex justify-between items-start mb-5">
                            <span class="inline-block px-3 py-1.5 bg-slate-50 text-slate-500 rounded-full text-xs font-semibold tracking-wide">${q.category || 'Genel'}</span>
                        </div>
                        
                        <p class="text-slate-800 text-lg sm:text-xl font-medium leading-snug mb-8">"${q.text}"</p>
                        
                        <div class="flex justify-between items-center pt-4 border-t border-slate-50">
                            <p class="text-slate-400 text-sm font-medium">— ${q.author || 'Anonim'}</p>
                            
                            <div class="flex gap-1.5 opacity-100 lg:opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="shareQuote(decodeURIComponent('${encodeURIComponent(q.text)}'), decodeURIComponent('${encodeURIComponent(q.author || 'Anonim')}'))" class="w-9 h-9 rounded-full bg-slate-50 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 flex items-center justify-center transition" title="Paylaş">
                                    <i class="fas fa-share-nodes text-sm"></i>
                                </button>
                                <button onclick="copyToClipboard(decodeURIComponent('${encodeURIComponent(q.text)}'))" class="w-9 h-9 rounded-full bg-slate-50 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 flex items-center justify-center transition" title="Kopyala">
                                    <i class="fas fa-copy text-sm"></i>
                                </button>
                                <button onclick="downloadImage('${q.id}')" class="w-9 h-9 rounded-full bg-slate-50 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 flex items-center justify-center transition" title="İndir">
                                    <i class="fas fa-image text-sm"></i>
                                </button>
                                ${isAdminLoggedIn ? `
                                <button onclick="deleteQuote('${q.id}')" class="w-9 h-9 rounded-full bg-red-50 text-red-400 hover:text-red-600 hover:bg-red-100 flex items-center justify-center transition" title="Sil">
                                    <i class="fas fa-trash-alt text-sm"></i>
                                </button>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        };

        // Söz Paylaşma Fonksiyonu (Mobil Uyumlu)
        window.shareQuote = async (text, author) => {
            const shareData = {
                title: 'Söz Kütüphanesi',
                text: `"${text}"\n— ${author}`
            };
            
            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    copyToClipboard(text);
                }
            } catch (err) {
                console.log('Paylaşım iptal edildi veya desteklenmiyor.');
            }
        };

        // Söz Kopyalama Fonksiyonu
        window.copyToClipboard = (text) => {
            const tempInput = document.createElement("textarea");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            
            showUIModal('alert', 'Başarılı', 'Söz panoya kopyalandı!');
        };

        // Otomatik Kategori Bulucu
        const autoCategorize = (text) => {
            const lower = text.toLowerCase();
            if (lower.match(/aşk|sevgi|kalp|özlem|sevgili/)) return 'Aşk';
            if (lower.match(/başarı|hedef|çalış|kazan|mücadele|asla|pes/)) return 'Motivasyon';
            if (lower.match(/zaman|hayat|insan|gerçek|dünya|anlam|yaşam/)) return 'Felsefe';
            if (lower.match(/komik|gül|eğlence/)) return 'Mizah';
            return 'Genel';
        };

        // Yönetici Girişi
        window.handleHeaderClick = () => {
            headerClickCount++;
            if (headerClickTimer) clearTimeout(headerClickTimer);
            
            headerClickTimer = setTimeout(() => { headerClickCount = 0; }, 2000);

            if (headerClickCount === 5) {
                headerClickCount = 0;
                showUIModal('prompt', 'Güvenlik', 'Yönetim şifresi:', (val) => {
                    if(val === '22035034') {
                        isAdminLoggedIn = true;
                        renderFeed();
                        document.getElementById('admin-modal').classList.remove('hidden');
                    } else {
                        showUIModal('alert', 'Hata', 'Şifre yanlış.');
                    }
                });
            }
        };

        window.closeAdmin = () => document.getElementById('admin-modal').classList.add('hidden');

        // Tekli Söz Ekleme
        window.saveSingleQuote = async () => {
            if(!currentUser) return;
            const text = document.getElementById('single-quote-text').value.trim();
            const author = document.getElementById('single-quote-author').value.trim();
            const category = document.getElementById('single-quote-category').value.trim();

            if(!text) return showUIModal('alert', 'Uyarı', 'Lütfen bir söz girin.');

            document.getElementById('loading-screen').classList.remove('hidden');
            document.getElementById('loading-screen').querySelector('p').innerText = 'Ekleniyor...';

            try {
                const quotesRef = collection(db, 'artifacts', appId, 'public', 'data', 'quotes');
                await addDoc(quotesRef, {
                    text: text,
                    author: author || 'Anonim',
                    category: category || autoCategorize(text),
                    createdAt: Date.now(),
                    addedBy: currentUser.uid
                });
                
                document.getElementById('single-quote-text').value = '';
                document.getElementById('single-quote-author').value = '';
                document.getElementById('single-quote-category').value = '';
                
                document.getElementById('loading-screen').classList.add('hidden');
                showUIModal('alert', 'Başarılı', 'Söz kütüphaneye eklendi.');
            } catch (err) {
                document.getElementById('loading-screen').classList.add('hidden');
                showUIModal('alert', 'Hata', 'Kayıt başarısız oldu.');
            }
        };

        // Kutuya metin yapıştırıldığında otomatik kaydetme
        document.getElementById('bulk-quotes').addEventListener('paste', () => {
            setTimeout(() => {
                if (document.getElementById('bulk-quotes').value.trim() !== '') {
                    window.saveBulkQuotesSmart();
                }
            }, 300);
        });

        // Yapay Zeka Destekli Toplu Kayıt
        window.saveBulkQuotesSmart = async () => {
            if(!currentUser) return;
            const bulkText = document.getElementById('bulk-quotes').value;
            
            if(!bulkText.trim()) {
                showUIModal('alert', 'Uyarı', 'Lütfen metin girin.');
                return;
            }

            const lines = bulkText.split('\n').map(l => l.replace(/^#\s*/, '').trim()).filter(l => l.length > 3);

            if(lines.length === 0) {
                showUIModal('alert', 'Uyarı', 'Geçerli söz bulunamadı.');
                return;
            }

            document.getElementById('admin-modal').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');
            document.getElementById('loading-screen').querySelector('p').innerText = 'Sözler analiz edilip kaydediliyor...';

            try {
                const quotesRef = collection(db, 'artifacts', appId, 'public', 'data', 'quotes');
                let count = 0;
                
                for(const line of lines) {
                    const category = autoCategorize(line); 
                    await addDoc(quotesRef, {
                        text: line,
                        author: 'Anonim', 
                        category: category, 
                        createdAt: Date.now() + count, 
                        addedBy: currentUser.uid
                    });
                    count++;
                }
                
                document.getElementById('bulk-quotes').value = '';
                document.getElementById('loading-screen').classList.add('hidden');
                showUIModal('alert', 'Tamamlandı', `${count} adet söz başarıyla kategorize edilip eklendi.`);
            } catch (err) {
                document.getElementById('loading-screen').classList.add('hidden');
                showUIModal('alert', 'Hata', 'Kayıt başarısız oldu. Hata detayı: ' + err.message);
            }
        };

        // Tekli Söz Silme
        window.deleteQuote = (id) => {
            showUIModal('confirm', 'Sözü Sil', 'Bu sözü kalıcı olarak silmek istiyor musunuz?', async () => {
                if(!currentUser) return;
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'quotes', id));
            });
        };

        // Toplu Söz Silme
        window.deleteAllQuotes = () => {
            if(allQuotes.length === 0) return showUIModal('alert', 'Bilgi', 'Silinecek söz bulunmuyor.');
            
            showUIModal('confirm', 'TÜMÜNÜ SİL', 'DİKKAT! Kütüphanedeki BÜTÜN sözler kalıcı olarak silinecek. Geri alınamaz. Onaylıyor musunuz?', async () => {
                if(!currentUser) return;
                
                document.getElementById('admin-modal').classList.add('hidden');
                document.getElementById('loading-screen').classList.remove('hidden');
                document.getElementById('loading-screen').querySelector('p').innerText = 'Sözler siliniyor...';

                try {
                    const promises = allQuotes.map(q => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'quotes', q.id)));
                    await Promise.all(promises);
                    
                    document.getElementById('loading-screen').classList.add('hidden');
                    showUIModal('alert', 'Başarılı', 'Bütün sözler başarıyla silindi.');
                } catch(e) {
                    document.getElementById('loading-screen').classList.add('hidden');
                    showUIModal('alert', 'Hata', 'Silme işlemi sırasında bir hata oluştu.');
                }
            });
        };

        // JSON Olarak Dışa Aktar
        window.exportData = () => {
            if(allQuotes.length === 0) return showUIModal('alert', 'Uyarı', 'Sistemde dışa aktarılacak söz yok.');
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allQuotes, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", `sozler_yedek.json`);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        };

        // Resim Olarak İndir
        window.downloadImage = (id) => {
            const card = document.getElementById(`card-${id}`).querySelector('.quote-card');
            const actions = card.querySelector('.flex.gap-1\\.5'); // İkon kutusu sınıfı
            if(actions) actions.style.opacity = '0'; // İndirirken ikonlar görünmesin
            
            html2canvas(card, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
                const link = document.createElement('a');
                link.download = `soz.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                if(actions) actions.style.opacity = ''; 
            });
        };

        initAuth();
    </script>
</body>
</html>
