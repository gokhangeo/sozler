<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Söz Kütüphanesi PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root{
            --paper:#faf8f3;
            --paper-edge:#ece5d6;
            --ink:#211c17;
            --ink-soft:#6b6259;
            --ink-faint:#a89f92;
            --cherry:#9f1239;
            --cherry-dark:#7f1030;
            --gold:#b8902f;
        }
        *{ -webkit-tap-highlight-color: transparent; }
        body{
            font-family:'Inter',sans-serif;
            background-color: var(--paper);
            background-image: radial-gradient(circle at top left, rgba(159,18,57,.07), transparent 35%), radial-gradient(circle at top right, rgba(184,144,47,.08), transparent 35%);
            background-attachment: fixed;
            color: var(--ink);
            touch-action: manipulation;
            min-height: 100vh;
        }
        .font-display{ font-family:'Fraunces', serif; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05);
        }

        .masonry-grid{ column-count:1; column-gap:1.25rem; }
        @media (min-width:640px){ .masonry-grid{ column-count:2; } }
        @media (min-width:1024px){ .masonry-grid{ column-count:3; } }
        .masonry-item{ break-inside: avoid; margin-bottom: 1.25rem; }

        .swipe-container{
            position:fixed; inset:0; overflow-y:scroll; scroll-snap-type:y mandatory;
            background:#1a1512; z-index:100;
        }
        .swipe-item{
            min-height:100vh; height:100vh; scroll-snap-align:start;
            display:flex; flex-direction:column; justify-content:center; align-items:center;
            padding:2rem; position:relative; background-size:cover; background-position:center;
        }
        .swipe-overlay {
            position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(15,23,42,0.3), rgba(15,23,42,0.9)); z-index: 0;
        }

        .sticky-header{ position:sticky; top:0; z-index:40; padding-top:1rem; }
        button, .clickable{ cursor:pointer; min-height:40px; min-width:40px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        button:active { transform: scale(0.95); }
        .active-btn { background-color: #0f172a !important; color: white !important; transform: scale(1.05); }

        .cat-pill{
            white-space:nowrap; padding:.55rem 1.1rem; border-radius:999px; font-size:11px;
            font-weight:700; text-transform:uppercase; letter-spacing:.08em;
            border:1px solid var(--paper-edge); background:#fff; color:var(--ink-soft);
            transition:all .25s ease;
        }
        .cat-pill.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
        .cat-pill:hover:not(.active){ border-color: var(--cherry); color:var(--cherry); }
        .cat-count{ opacity:.55; font-weight:500; margin-left:2px; }

        .quote-card{
            position:relative; background:#fff; border:1px solid var(--paper-edge);
            border-radius:1.75rem; padding:2rem; overflow:hidden;
            background-size:cover; background-position:center;
            transition: transform .4s ease, box-shadow .4s ease;
        }
        .quote-card:hover{ transform: translateY(-4px); box-shadow: 0 24px 48px -20px rgba(33,28,23,.18); }

        .qc-text{ font-family:'Fraunces', serif; font-style:italic; font-size:1.35rem; line-height:1.5; color:var(--ink); margin:1.5rem 0 2rem; position:relative; z-index:1; }
        .qc-author{ font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); }
        .qc-top, .qc-bottom{ position:relative; z-index:1; display:flex; justify-content:space-between; align-items:center; }
        .qc-bottom{ padding-top:1.25rem; border-top:1px solid rgba(33,28,23,.07); }
        .qc-actions{ display:flex; gap:.4rem; }
        .qc-icon-btn{
            width:34px; height:34px; border-radius:999px; display:flex; align-items:center; justify-content:center;
            background: rgba(33,28,23,.05); color:var(--ink-soft); font-size:12px; transition: all .2s ease;
        }
        .qc-icon-btn:hover{ background: var(--cherry); color:#fff; }
        .qc-icon-btn.favorite-active{ background:var(--cherry); color:#fff; }
        .sync-status{ font-size:11px; color:var(--ink-faint); line-height:1.5; }
        @media (max-width:640px){
            .sticky-header{ padding-top:.35rem; }
            .sticky-header header{ margin-bottom:.65rem; }
            #search-input{ padding-top:.65rem; padding-bottom:.65rem; }
            .cat-pill{ padding:.45rem .8rem; font-size:10px; }
            .quote-card{ padding:1.4rem; border-radius:1.35rem; }
            .qc-text{ font-size:1.2rem; margin:1.15rem 0 1.4rem; }
            #daily-panel{ padding:1.5rem; border-radius:1.5rem; }
        }

        .btn-primary{ background:var(--cherry); color:#fff; transition:background .2s ease; }
        .btn-primary:hover{ background:var(--cherry-dark); }

        .fade-out{ opacity:0; transition:opacity .5s ease; pointer-events:none; }
        #loading-screen.hidden{ display:none !important; }
        .scrollbar-hide::-webkit-scrollbar{ display:none; }
        .scrollbar-hide{ -ms-overflow-style:none; scrollbar-width:none; }
    </style>
</head>
<body class="antialiased pb-24">

    <div id="loading-screen" class="fixed inset-0 z-[200] flex flex-col items-center justify-center" style="background:var(--paper);">
        <i class="fa-solid fa-feather-pointed text-3xl mb-5 animate-pulse" style="color:var(--cherry);"></i>
        <p class="text-xs uppercase tracking-[0.3em] font-semibold" style="color:var(--ink-faint);">Kütüphane Hazırlanıyor</p>
    </div>

    <div class="max-w-6xl mx-auto px-4 hidden opacity-0 transition-opacity duration-500" id="app-container">

        <div class="sticky-header py-4" style="background: linear-gradient(var(--paper), var(--paper) 80%, transparent); backdrop-filter: blur(6px);">
            <header class="flex justify-between items-center mb-5">
                <h1 onclick="handleHeaderClick()" class="clickable font-display italic text-2xl md:text-3xl font-semibold tracking-tight flex items-center gap-3 select-none">
                    <i class="fa-solid fa-feather-pointed text-xl" style="color:var(--cherry);"></i> Söz Kütüphanesi
                </h1>
                <div class="flex gap-2">
                    <button onclick="showRandomQuote()" id="random-quote-btn" title="Rastgele söz" aria-label="Rastgele söz göster" class="p-3 rounded-xl bg-white border qc-icon-btn" style="border-color:var(--paper-edge); width:auto; height:auto;">
                        <i class="fas fa-shuffle"></i>
                    </button>
                    <button onclick="switchView('gallery')" id="view-gal-btn" title="Kart görünümü" aria-label="Kart görünümü" class="p-3 rounded-xl bg-white border qc-icon-btn" style="border-color:var(--paper-edge); width:auto; height:auto;">
                        <i class="fas fa-th-large"></i>
                    </button>
                    <button onclick="switchView('swipe')" id="view-swp-btn" title="Tam ekran söz görünümü" aria-label="Tam ekran söz görünümü" class="p-3 rounded-xl bg-white border qc-icon-btn" style="border-color:var(--paper-edge); width:auto; height:auto;">
                        <i class="fas fa-mobile-screen"></i>
                    </button>
                </div>
            </header>

            <div class="flex items-center bg-white rounded-2xl px-4 mb-4 border transition-all" style="border-color:var(--paper-edge);">
                <i class="fas fa-search mr-3 text-sm" style="color:var(--ink-faint);"></i>
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="Sözlerde ara..." class="w-full py-3 bg-transparent outline-none text-sm">
            </div>

            <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide" id="library-filters"></div>
        </div>

        <!-- Günün Sözü -->
        <div id="daily-panel" class="mb-8 p-7 md:p-10 rounded-[2rem] text-white relative overflow-hidden hidden bg-cover bg-center" style="background-color:#1a1512;">
            <div class="ink-veil" id="daily-veil" style="display:none;"></div>
            <div class="absolute -right-6 -top-6 text-[10rem] opacity-10 font-display">
                <i class="fas fa-quote-right"></i>
            </div>
            <div class="relative z-10">
                <div class="flex items-center justify-between mb-6">
                    <span class="inline-block px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-[0.2em]" style="background:rgba(184,144,47,.25); color:#f2d998;">Günün İlhamı</span>
                </div>
                <p id="daily-text" class="font-display italic text-2xl md:text-4xl font-normal leading-tight mb-8">"..."</p>
                <div class="flex justify-between items-end">
                    <div>
                        <p id="daily-author" class="font-semibold text-lg" style="color:#f2d998;">— </p>
                        <p class="text-[10px] text-white/40 uppercase mt-1 tracking-widest">Söz Kütüphanesi</p>
                    </div>
                    <div class="flex gap-2">
                        <button id="daily-favorite-btn" onclick="toggleFavorite(dailyQuoteId)" title="Favoriye ekle" class="w-12 h-12 rounded-full hover:bg-white/20 transition flex items-center justify-center" style="background:rgba(255,255,255,.1);"><i class="far fa-heart"></i></button>
                        <button onclick="copyQuoteById(dailyQuoteId)" title="Kopyala" class="w-12 h-12 rounded-full hover:bg-white/20 transition flex items-center justify-center" style="background:rgba(255,255,255,.1);"><i class="far fa-copy"></i></button>
                        <button onclick="shareDaily()" title="Paylaş" class="w-12 h-12 rounded-full hover:bg-white/20 transition flex items-center justify-center" style="background:rgba(255,255,255,.1);"><i class="fas fa-share-alt"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Yönetim Paneli -->
        <div id="admin-dashboard" class="hidden mb-8 p-6 md:p-8 bg-white rounded-[2rem] border-2" style="border-color:var(--paper-edge);">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-xl font-bold flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white text-sm" style="background:var(--cherry);">
                        <i class="fas fa-user-shield"></i>
                    </div>
                    Yönetim Paneli
                </h2>
                <button onclick="logoutAdmin()" class="text-xs font-black uppercase tracking-widest" style="color:var(--cherry);">Kapat</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-4">
                    <div id="edit-title" class="text-xs font-black uppercase tracking-widest" style="color:var(--ink-faint);">Söz İşlemleri</div>
                    <input type="hidden" id="edit-id">
                    <textarea id="quote-text" rows="3" class="w-full p-5 rounded-2xl border outline-none text-sm transition-all" style="border-color:var(--paper-edge); background:var(--paper);" placeholder="Sözü buraya yazın..."></textarea>
                    <input type="text" id="quote-author" class="w-full p-3.5 rounded-xl border text-sm outline-none" style="border-color:var(--paper-edge); background:var(--paper);" placeholder="Yazar">
                    <div class="flex gap-2">
                        <button onclick="saveQuote()" id="save-btn" class="flex-1 btn-primary py-4 rounded-xl font-bold transition-all">Sözü Kaydet</button>
                        <button onclick="resetAdminForm()" class="px-5 rounded-xl" style="background:var(--paper); color:var(--ink-faint);"><i class="fas fa-rotate-left"></i></button>
                    </div>
                </div>
                <div class="space-y-4">
                    <div class="text-xs font-black uppercase tracking-widest" style="color:var(--ink-faint);">Akıllı İşlemler</div>
                    <textarea id="bulk-quotes" rows="3" class="w-full p-5 rounded-2xl border text-sm outline-none" style="border-color:var(--paper-edge); background:var(--paper);" placeholder="Parantezli yazar isimlerini içeren listeyi yapıştırın..."></textarea>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="saveBulk()" class="text-white py-3.5 rounded-xl text-sm font-bold transition-all" style="background:var(--ink);">Toplu Aktar</button>
                        <button onclick="fixExistingQuotes()" class="py-3.5 rounded-xl text-sm font-bold transition-all" style="background:rgba(159,18,57,.1); color:var(--cherry);">Kütüphaneyi Düzenle</button>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="exportData()" class="flex-1 bg-white border py-2 rounded-xl text-xs font-bold" style="border-color:var(--paper-edge); color:var(--ink-soft);">Yedek Al</button>
                        <button onclick="deleteAllQuotes()" class="flex-1 text-[10px] font-black uppercase" style="color:#c2634f;">Kütüphaneyi Temizle</button>
                    </div>
                </div>
                <div class="space-y-3 md:col-span-2 pt-6 border-t" style="border-color:var(--paper-edge);">
                    <div class="text-xs font-black uppercase tracking-widest" style="color:var(--ink-faint);">Firebase Favori Senkronizasyonu</div>
                    <p id="firebase-favorite-status" class="sync-status">Favoriler mevcut Firebase veritabanına otomatik kaydedilir ve açık cihazlarda anlık eşitlenir.</p>
                </div>
            </div>
        </div>

        <div class="masonry-grid" id="gallery-feed"></div>
        <div id="swipe-feed" class="swipe-container hidden"></div>

        <div id="empty-state" class="hidden text-center py-32">
            <div class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6" style="background:var(--paper-edge);">
                <i class="fas fa-magnifying-glass text-3xl" style="color:var(--ink-faint);"></i>
            </div>
            <p class="font-medium" style="color:var(--ink-faint);">Aradığın söz bulunamadı.</p>
        </div>
    </div>

    <!-- Modals -->
    <div id="ui-modal" class="fixed inset-0 bg-black/40 z-[300] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-sm border" style="border-color:var(--paper-edge);">
            <h3 id="ui-modal-title" class="font-display italic text-xl font-semibold mb-2">Başlık</h3>
            <div id="ui-modal-message" class="text-sm mb-8 leading-relaxed" style="color:var(--ink-soft);">Mesaj</div>
            <input type="password" id="ui-modal-input" class="hidden w-full p-5 rounded-2xl border mb-8 text-center tracking-[0.5em] text-2xl font-bold outline-none" style="border-color:var(--paper-edge); background:var(--paper);" placeholder="••••">
            <div class="flex gap-3 justify-end">
                <button id="ui-modal-cancel" class="hidden px-6 py-3 rounded-xl font-bold transition-all" style="color:var(--ink-faint);">İptal</button>
                <button id="ui-modal-confirm" class="px-8 py-3 rounded-xl btn-primary font-bold transition-all">Tamam</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot, updateDoc, getDocs, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVbPr8GHUqx5nWtVlv_QVep5Or8vvLTGk",
            authDomain: "sozler-e81af.firebaseapp.com",
            databaseURL: "https://sozler-e81af-default-rtdb.firebaseio.com",
            projectId: "sozler-e81af",
            storageBucket: "sozler-e81af.firebasestorage.app",
            messagingSenderId: "289783119309",
            appId: "1:289783119309:web:c1ac900ccc610ed1b65884"
        };

        const appId = 'sabit-soz-kutuphanesi';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null, allQuotes = [], filteredQuotes = [], isAdminLoggedIn = false;
        let headerClickCount = 0, headerClickTimer = null, currentFilter = 'Tümü', currentView = 'gallery';
        let favorites = new Set();
        let searchTimer = null, favoritesUnsubscribe = null;
        window.dailyQuoteId = null;

        const normalizeQuoteText = (value = '') => {
            let text = String(value).trim();
            const pairs = [
                ['"', '"'], ["'", "'"], ['“', '”'], ['‘', '’'], ['«', '»']
            ];
            let changed = true;
            while (changed && text.length > 1) {
                changed = false;
                for (const [open, close] of pairs) {
                    if (text.startsWith(open) && text.endsWith(close)) {
                        text = text.slice(open.length, -close.length).trim();
                        changed = true;
                        break;
                    }
                }
            }
            return text;
        };

        const showUIModal = (type, title, message, onConfirm = null) => {
            const modal = document.getElementById('ui-modal');
            if (!modal) return;
            
            const titleEl = document.getElementById('ui-modal-title');
            if (titleEl) titleEl.innerText = title;
            const msgEl = document.getElementById('ui-modal-message');
            if (msgEl) msgEl.innerHTML = message;
            
            const input = document.getElementById('ui-modal-input');
            const cancelBtn = document.getElementById('ui-modal-cancel');
            const confirmBtn = document.getElementById('ui-modal-confirm');
            
            if (input) { input.classList.add('hidden'); input.value = ''; }
            if (cancelBtn) cancelBtn.classList.add('hidden');
            
            if (confirmBtn) {
                confirmBtn.onclick = () => { 
                    modal.classList.add('hidden'); 
                    if (onConfirm) onConfirm(input ? input.value : ''); 
                };
            }
            
            if (type === 'prompt') { 
                if (input) input.classList.remove('hidden'); 
                if (cancelBtn) cancelBtn.classList.remove('hidden'); 
                setTimeout(() => { if (input) input.focus(); }, 100); 
            } else if (type === 'confirm') { 
                if (cancelBtn) cancelBtn.classList.remove('hidden'); 
            }
            
            if (cancelBtn) {
                cancelBtn.onclick = () => modal.classList.add('hidden');
            }
            
            modal.classList.remove('hidden');
        };

        const initAuth = async () => {
            try { await signInAnonymously(auth); }
            catch (e) { const loader = document.getElementById('loading-screen'); if (loader) loader.innerHTML = `<p class='p-8 text-center text-red-500'>Bağlantı Hatası: ${e.message}</p>`; }
        };

        onAuthStateChanged(auth, (user) => { if (user) { currentUser = user; loadData(); loadFavorites(); } });

        const setFavoriteStatus = (text) => {
            const el = document.getElementById('firebase-favorite-status');
            if (el) el.textContent = text;
        };

        const loadFavorites = () => {
            if (favoritesUnsubscribe) favoritesUnsubscribe();
            const favoritesRef = collection(db, 'artifacts', appId, 'public', 'data', 'favorites');
            favoritesUnsubscribe = onSnapshot(favoritesRef, (snapshot) => {
                favorites = new Set(snapshot.docs.map(item => item.id));
                updateLibraryFilters();
                filterQuotes();
                updateDailyFavoriteButton();
                setFavoriteStatus(`${favorites.size} favori Firebase ile eşitlendi.`);
            }, (error) => {
                console.error('Favoriler yüklenemedi:', error);
                setFavoriteStatus('Favoriler Firebase üzerinden yüklenemedi. Firestore kurallarını kontrol edin.');
            });
        };

        const loadData = () => {
            const quotesRef = collection(db, 'artifacts', appId, 'public', 'data', 'quotes');
            onSnapshot(quotesRef, (snapshot) => {
                const loader = document.getElementById('loading-screen');
                if (loader) { 
                    loader.classList.add('fade-out'); 
                    setTimeout(() => { if (loader) loader.classList.add('hidden'); }, 500); 
                }
                const appCont = document.getElementById('app-container');
                if (appCont) { 
                    appCont.classList.remove('hidden'); 
                    setTimeout(() => { if (appCont) appCont.classList.remove('opacity-0'); }, 50); 
                }
                allQuotes = snapshot.docs.map(doc => { const data = doc.data(); return { id: doc.id, ...data, text: normalizeQuoteText(data.text || '') }; }).sort((a, b) => b.createdAt - a.createdAt);
                setDailyQuote(); updateLibraryFilters(); filterQuotes(); updateDailyFavoriteButton();
            }, (err) => console.error(err));
        };

        const setDailyQuote = () => {
            if (allQuotes.length === 0) return;
            const now = new Date(), start = new Date(now.getFullYear(), 0, 0), diff = now - start, day = Math.floor(diff / (1000 * 60 * 60 * 24));
            const quote = allQuotes[day % allQuotes.length];
            window.dailyQuoteId = quote.id;
            
            const txtEl = document.getElementById('daily-text');
            if (txtEl) txtEl.innerText = `“${normalizeQuoteText(quote.text)}”`;
            
            const authorEl = document.getElementById('daily-author');
            if (authorEl) authorEl.innerText = `— ${quote.author || 'Anonim'}`;
            
            const panel = document.getElementById('daily-panel');
            const veil = document.getElementById('daily-veil');
            if (panel) {
                panel.style.backgroundImage = 'none';
                if (veil) veil.style.display = 'none';
                panel.classList.remove('hidden');
            }
        };

        const updateLibraryFilters = () => {
            const filterCont = document.getElementById('library-filters');
            if (!filterCont) return;
            const filters = [
                { key: 'Tümü', label: 'Tüm Sözler', count: allQuotes.length, icon: 'fa-book-open' },
                { key: 'Favoriler', label: 'Favoriler', count: favorites.size, icon: 'fa-heart' }
            ];
            filterCont.innerHTML = filters.map(item =>
                `<button onclick="setLibraryFilter('${item.key}')" class="cat-pill ${currentFilter === item.key ? 'active' : ''}"><i class="fas ${item.icon} mr-1"></i>${item.label} <span class="cat-count">${item.count}</span></button>`
            ).join('');
        };

        window.setLibraryFilter = (filter) => { currentFilter = filter; updateLibraryFilters(); filterQuotes(); };
        window.handleSearch = () => { clearTimeout(searchTimer); searchTimer = setTimeout(filterQuotes, 250); };
        const escapeHTML = (v='') => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

        window.filterQuotes = () => {
            const searchInput = document.getElementById('search-input');
            const search = searchInput ? searchInput.value.toLowerCase() : '';
            filteredQuotes = allQuotes.filter(q => {
                const matchFilter = currentFilter === 'Tümü' || favorites.has(q.id);
                const matchSearch = q.text.toLowerCase().includes(search) || (q.author && q.author.toLowerCase().includes(search));
                return matchFilter && matchSearch;
            });
            renderUI();
        };

        const renderUI = () => {
            const galFeed = document.getElementById('gallery-feed'), swpFeed = document.getElementById('swipe-feed'), empty = document.getElementById('empty-state');
            if (filteredQuotes.length === 0) { 
                if (galFeed) galFeed.innerHTML = ''; 
                if (swpFeed) swpFeed.innerHTML = ''; 
                if (empty) empty.classList.remove('hidden'); 
                return; 
            }
            if (empty) empty.classList.add('hidden');

            if (galFeed) {
                galFeed.innerHTML = filteredQuotes.map(q => {
                    return `
                    <div class="masonry-item" id="card-${q.id}">
                        <div class="quote-card">
                            <p class="qc-text">“${escapeHTML(normalizeQuoteText(q.text))}”</p>
                            <div class="qc-bottom">
                                <p class="qc-author">— ${escapeHTML(q.author || 'Anonim')}</p>
                                <div class="qc-actions">
                                    <button onclick="toggleFavorite('${q.id}')" title="Favoriye ekle/çıkar" class="qc-icon-btn ${favorites.has(q.id) ? 'favorite-active' : ''}"><i class="${favorites.has(q.id) ? 'fas' : 'far'} fa-heart"></i></button>
                                    <button onclick="copyQuoteById('${q.id}')" title="Kopyala" class="qc-icon-btn"><i class="far fa-copy"></i></button>
                                    <button onclick="shareQuoteById('${q.id}')" title="Paylaş" class="qc-icon-btn"><i class="fas fa-share-nodes"></i></button>
                                    ${isAdminLoggedIn ? `
                                        <button onclick="editQuote('${q.id}')" class="qc-icon-btn"><i class="fas fa-pen"></i></button>
                                        <button onclick="deleteQuote('${q.id}')" class="qc-icon-btn"><i class="fas fa-trash-alt"></i></button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            }

            if (swpFeed) {
                swpFeed.innerHTML = filteredQuotes.map(q => {
                    return `
                    <div class="swipe-item">
                        <button onclick="switchView('gallery')" aria-label="Tam ekran görünümünü kapat" class="fixed top-5 right-5 z-[120] w-11 h-11 rounded-full text-white flex items-center justify-center" style="background:rgba(0,0,0,.32); backdrop-filter:blur(8px);"><i class="fas fa-times"></i></button>
                        <div class="text-center max-w-xl relative z-10">
                            <i class="fas fa-quote-left text-6xl mb-10" style="color:rgba(184,144,47,.5);"></i>
                            <p class="font-display italic text-3xl md:text-5xl text-white leading-tight mb-10 px-4" style="text-shadow:0 2px 12px rgba(0,0,0,.5);">“${escapeHTML(normalizeQuoteText(q.text))}”</p>
                            <p class="text-lg font-semibold uppercase tracking-widest" style="color:#f2d998;">— ${escapeHTML(q.author || 'Anonim')}</p>
                        </div>
                        <div class="absolute bottom-20 flex gap-5 relative z-10">
                            <button onclick="toggleFavorite('${q.id}')" class="w-14 h-14 rounded-full text-white flex items-center justify-center border border-white/10" style="background:${favorites.has(q.id) ? 'rgba(159,18,57,.85)' : 'rgba(255,255,255,.08)'};"><i class="${favorites.has(q.id) ? 'fas' : 'far'} fa-heart"></i></button>
                            <button onclick="copyQuoteById('${q.id}')" title="Kopyala" class="w-14 h-14 rounded-full text-white flex items-center justify-center border border-white/10" style="background:rgba(255,255,255,.08);"><i class="far fa-copy"></i></button>
                            <button onclick="shareQuoteById('${q.id}')" class="w-14 h-14 rounded-full text-white flex items-center justify-center border border-white/10" style="background:rgba(255,255,255,.08);"><i class="fas fa-share-alt"></i></button>
                        </div>
                    </div>`;
                }).join('');
            }
        };

        window.switchView = (v) => {
            currentView = v;
            const gal = document.getElementById('gallery-feed'), swp = document.getElementById('swipe-feed'), daily = document.getElementById('daily-panel');
            if (gal) gal.classList.toggle('hidden', v !== 'gallery');
            if (swp) swp.classList.toggle('hidden', v !== 'swipe');
            if (daily) daily.classList.toggle('hidden', v !== 'gallery');
            const galBtn = document.getElementById('view-gal-btn'), swpBtn = document.getElementById('view-swp-btn');
            if (galBtn) {
                galBtn.style.background = (v === 'gallery') ? 'var(--ink)' : '#fff';
                galBtn.style.color = (v === 'gallery') ? '#fff' : 'var(--ink-soft)';
            }
            if (swpBtn) {
                swpBtn.style.background = (v === 'swipe') ? 'var(--ink)' : '#fff';
                swpBtn.style.color = (v === 'swipe') ? '#fff' : 'var(--ink-soft)';
            }
            document.body.style.overflow = (v === 'swipe') ? 'hidden' : 'auto';
        };

        const copyText = async (text) => {
            try {
                if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
                else { const t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
                showUIModal('alert','Kopyalandı','Söz panoya kopyalandı.');
            } catch(e) { showUIModal('alert','Paylaşım',escapeHTML(text).replace(/\n/g,'<br>')); }
        };
        window.shareQuote = async (text, author) => {
            const value = `"${text}"\n— ${author || 'Anonim'}`;
            try {
                if (navigator.share && window.isSecureContext) { await navigator.share({title:'Söz Kütüphanesi', text:value}); return; }
                await copyText(value);
            } catch(e) { if (e?.name !== 'AbortError') await copyText(value); }
        };
        window.copyQuoteById = async id => {
            const q = allQuotes.find(x => x.id === id);
            if (!q) return;
            await copyText(`“${normalizeQuoteText(q.text)}”\n— ${q.author || 'Anonim'}`);
        };
        window.shareQuoteById = id => { const q=allQuotes.find(x=>x.id===id); if(q) shareQuote(normalizeQuoteText(q.text),q.author); };
        window.shareDaily = () => shareQuoteById(window.dailyQuoteId);

        window.showRandomQuote = () => {
            const pool = filteredQuotes.length ? filteredQuotes : allQuotes;
            if (!pool.length) return showUIModal('alert', 'Rastgele Söz', 'Kütüphanede henüz söz bulunmuyor.');
            const quote = pool[Math.floor(Math.random() * pool.length)];
            switchView('gallery');
            requestAnimationFrame(() => {
                const card = document.getElementById(`card-${quote.id}`);
                if (!card) return;
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                const inner = card.querySelector('.quote-card');
                if (inner) {
                    inner.animate([
                        { transform: 'scale(1)', boxShadow: '0 4px 20px -2px rgba(0,0,0,.05)' },
                        { transform: 'scale(1.025)', boxShadow: '0 20px 45px -12px rgba(159,18,57,.35)' },
                        { transform: 'scale(1)', boxShadow: '0 4px 20px -2px rgba(0,0,0,.05)' }
                    ], { duration: 1100, easing: 'ease-out' });
                }
            });
        };
        const updateDailyFavoriteButton = () => {
            const b=document.getElementById('daily-favorite-btn'); if(!b || !window.dailyQuoteId) return;
            const active=favorites.has(window.dailyQuoteId); b.innerHTML=`<i class="${active?'fas':'far'} fa-heart"></i>`; b.style.background=active?'rgba(159,18,57,.9)':'rgba(255,255,255,.1)';
        };
        window.toggleFavorite = async (id) => {
            if (!id) return;
            const favoriteRef = doc(db, 'artifacts', appId, 'public', 'data', 'favorites', id);
            const isFavorite = favorites.has(id);

            try {
                setFavoriteStatus(isFavorite ? 'Favoriden çıkarılıyor...' : 'Favorilere ekleniyor...');
                if (isFavorite) {
                    await deleteDoc(favoriteRef);
                } else {
                    const quote = allQuotes.find(item => item.id === id);
                    await setDoc(favoriteRef, {
                        quoteId: id,
                        text: quote?.text || '',
                        author: quote?.author || 'Anonim',
                        createdAt: Date.now()
                    });
                }
            } catch (error) {
                console.error('Favori işlemi başarısız:', error);
                setFavoriteStatus('Favori kaydedilemedi. Firestore yazma izinlerini kontrol edin.');
                showUIModal('alert', 'Favori Kaydedilemedi', 'Firebase bağlantısı veya Firestore güvenlik kuralları nedeniyle işlem tamamlanamadı.');
            }
        };

        window.handleHeaderClick = () => {
            headerClickCount++; 
            if (headerClickTimer) clearTimeout(headerClickTimer); 
            headerClickTimer = setTimeout(() => { headerClickCount = 0; }, 2000);
            if (headerClickCount === 5) {
                headerClickCount = 0; 
                if (isAdminLoggedIn) return;
                showUIModal('prompt', 'Güvenlik', 'Yönetim şifresini girin:', (v) => {
                    if (v === '22035034') { 
                        isAdminLoggedIn = true; 
                        const dash = document.getElementById('admin-dashboard');
                        if (dash) {
                            dash.classList.remove('hidden'); 
                            window.scrollTo({ top: 0, behavior: 'smooth' }); 
                        }
                        renderUI(); 
                    }
                    else showUIModal('alert', 'Hata', 'Şifre hatalı.');
                });
            }
        };

        window.logoutAdmin = () => { 
            isAdminLoggedIn = false; 
            const dash = document.getElementById('admin-dashboard');
            if (dash) dash.classList.add('hidden'); 
            renderUI(); 
        };

        const parseQuoteLine = (line) => {
            let text = normalizeQuoteText(line);
            let author = 'Anonim';
            const match = text.match(/\(([^)]+)\)$/);
            if (match) { 
                author = match[1].trim(); 
                text = text.replace(match[0], '').trim(); 
            }
            return { text: normalizeQuoteText(text), author };
        };

        window.fixExistingQuotes = async () => {
            showUIModal('confirm', 'Kütüphaneyi Düzenle', 'Tüm kütüphane taranacak; çift tırnaklar temizlenecek ve parantez içindeki yazar isimleri ayrıştırılacak. Onaylıyor musunuz?', async () => {
                const loader = document.getElementById('loading-screen');
                if (loader) { loader.classList.remove('hidden'); loader.classList.remove('fade-out'); }
                try {
                    let fixCount = 0;
                    const snapshot = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'quotes'));
                    for (const docSnap of snapshot.docs) {
                        const data = docSnap.data();
                        if (data.text) {
                            const parsed = parseQuoteLine(data.text);
                            const cleanedText = normalizeQuoteText(parsed.text);
                            const currentAuthor = data.author || parsed.author;
                            if (cleanedText !== data.text || (!data.author && parsed.author !== 'Anonim')) {
                                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'quotes', docSnap.id), { text: cleanedText, author: currentAuthor });
                                fixCount++;
                            }
                        }
                    }
                    if (loader) loader.classList.add('hidden');
                    showUIModal('alert', 'Tamamlandı', `${fixCount} adet söz başarıyla temizlendi.`);
                } catch (e) {
                    if (loader) loader.classList.add('hidden');
                    showUIModal('alert', 'Hata', 'Düzenleme işlemi sırasında bir sorun oluştu.');
                }
            });
        };

        window.saveQuote = async () => {
            const rawTextEl = document.getElementById('quote-text');
            const authEl = document.getElementById('quote-author');
            const editIdEl = document.getElementById('edit-id');

            const rawText = rawTextEl ? rawTextEl.value.trim() : '';
            let { text, author } = parseQuoteLine(rawText);
            const overrideAuthor = authEl ? authEl.value.trim() : '';
            const editId = editIdEl ? editIdEl.value : '';

            if (!text) return showUIModal('alert', 'Uyarı', 'Söz içeriği boş bırakılamaz.');

            try {
                const finalAuthor = overrideAuthor || author;
                if (editId) { 
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'quotes', editId), { text, author: finalAuthor }); 
                } else { 
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'quotes'), { text, author: finalAuthor, createdAt: Date.now() }); 
                }
                resetAdminForm(); 
                showUIModal('alert', 'Başarılı', 'İşlem tamamlandı.');
            } catch (e) { 
                showUIModal('alert', 'Hata', 'Veri kaydedilemedi.'); 
            }
        };

        window.editQuote = (id) => {
            const q = allQuotes.find(item => item.id === id); 
            if (!q) return;
            
            const txtEl = document.getElementById('quote-text');
            const authEl = document.getElementById('quote-author');
            const idEl = document.getElementById('edit-id');
            const titleEl = document.getElementById('edit-title');
            const btnEl = document.getElementById('save-btn');
            
            if (txtEl) txtEl.value = q.text; 
            if (authEl) authEl.value = q.author || ''; 
            if (idEl) idEl.value = id; 
            if (titleEl) titleEl.innerText = "Düzenle"; 
            if (btnEl) btnEl.innerText = "Güncelle"; 
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.resetAdminForm = () => {
            const txtEl = document.getElementById('quote-text');
            const authEl = document.getElementById('quote-author');
            const idEl = document.getElementById('edit-id');
            const titleEl = document.getElementById('edit-title');
            const btnEl = document.getElementById('save-btn');
            
            if (txtEl) txtEl.value = ''; 
            if (authEl) authEl.value = ''; 
            if (idEl) idEl.value = '';
            if (titleEl) titleEl.innerText = "Yeni Söz Ekle"; 
            if (btnEl) btnEl.innerText = "Sözü Kaydet";
        };

        window.saveBulk = async () => {
            const bulkInput = document.getElementById('bulk-quotes');
            const bulk = bulkInput ? bulkInput.value.trim() : '';
            if (!bulk) return;
            
            const lines = bulk.split('\n').map(l => l.replace(/^[\.#\s]*/, '').trim()).filter(l => l.length > 3);
            const qRef = collection(db, 'artifacts', appId, 'public', 'data', 'quotes');
            
            const loader = document.getElementById('loading-screen');
            if (loader) { loader.classList.remove('hidden'); loader.classList.remove('fade-out'); }
            
            try {
                for (let i = 0; i < lines.length; i++) {
                    const { text, author } = parseQuoteLine(lines[i]);
                    await addDoc(qRef, { text, author, createdAt: Date.now() + i });
                }
                if (bulkInput) bulkInput.value = '';
                if (loader) loader.classList.add('hidden');
                showUIModal('alert', 'Tamam', `${lines.length} adet söz aktarıldı.`);
            } catch (e) {
                if (loader) loader.classList.add('hidden');
                showUIModal('alert', 'Hata', 'Kayıt sırasında hata oluştu.');
            }
        };

        window.deleteQuote = (id) => {
            showUIModal('confirm', 'Sözü Sil', 'Bu sözü kütüphaneden kalıcı olarak siliyorsunuz?', async () => { 
                try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'quotes', id)); } catch (e) {} 
            });
        };

        window.deleteAllQuotes = () => {
            showUIModal('confirm', 'TÜMÜNÜ SİL?', 'Geri dönüş yok!', async () => {
                const loader = document.getElementById('loading-screen');
                if (loader) { loader.classList.remove('hidden'); loader.classList.remove('fade-out'); }
                try {
                    const snapshot = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'quotes'));
                    await Promise.all(snapshot.docs.map(d => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'quotes', d.id))));
                    if (loader) loader.classList.add('hidden');
                    showUIModal('alert', 'Temizlendi', 'Kütüphane tamamen boşaltıldı.');
                } catch (e) {
                    if (loader) loader.classList.add('hidden');
                    showUIModal('alert', 'Hata', 'İşlem başarısız.');
                }
            });
        };

        window.exportData = () => { 
            if (allQuotes.length === 0) return; 
            const data = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allQuotes, null, 2)); 
            const a = document.createElement('a'); 
            a.href = data; 
            a.download = `yedek_${Date.now()}.json`; 
            a.click(); 
        };

        document.addEventListener('keydown',e=>{if(e.key==='Escape'&&currentView==='swipe')switchView('gallery');});
        initAuth();
        switchView('gallery');
    </script>
</body>
</html>
